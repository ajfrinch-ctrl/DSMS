async function confirmDeleteMember(m){
  if(!confirm(`Delete member ${m.memberId} — ${m.nameBn || m.nameEn}?`)) return;
  await log("গুরুত্বপূর্ণ Account Activity", `Member Deleted: ${m.memberId}`);
  await del("members", m.id);
  const ds = await all("deposits");
  for(const d of ds.filter(x => x.memberId === m.memberId)){
    await del("deposits", d.id);
  }
  toast("Member and related transactions deleted");
  dataManagement();
}

async function backup(){
  if(role(session) !== "ADMIN"){ toast("Admin access required"); return; }
  let data = { members:await all("members"), deposits:await all("deposits"), notifications:await all("notifications"), activityLogs:await all("activityLogs"), settings:await all("settings") };
  $("#main").innerHTML = `<div class="section-title">Backup & Restore</div><div class="card"><button class="primary" id="b">Download Backup</button><input id="restore" type="file" accept=".json" style="margin-left:8px"><button class="danger" id="r">Restore</button><div class="notice">Restore replaces local IndexedDB data. Use only a trusted backup.</div></div>`;
  $("#b").onclick = () => {
    let a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type:"application/json" }));
    a.download = "Dhruvo_Sangsad_Backup.json";
    a.click();
    log("Backup");
  };
  $("#r").onclick = async () => {
    if(!confirm("Restore backup?")) return;
    let f = $("#restore").files[0];
    if(!f) return toast("Select backup");
    let x = JSON.parse(await f.text());
    for(const s of stores.slice(0,5)) for(const v of x[s] || []){
      if(!v || !v.id) continue;
      suppressCloudQueue = true; try{ await put(s, v); }finally{ suppressCloudQueue = false; }
      if(s === "members") await queue("updateMember", v);
      else if(s === "deposits") await queue("updateDeposit", v);
      else if(s === "notifications") await queue(v.type ? "createNotification" : "updateNotification", v);
      else if(s === "activityLogs") await queue("createActivityLog", v);
      else if(s === "settings") await queue("updateSettings", v);
    }
    await log("Restore", "Local backup restored and queued for cloud synchronization");
    if(cloudReady) await syncQueue();
    toast("Restore complete");
    route("home");
  };
}

  /* Render Activity Log inside Settings as a professional card option */
  await renderActivityLogSettings($("#settingsActivityLogSection"));

  if(!isMember){
    $("#saveOrgName").onclick = async () => {
      const org = $("#setOrg").value.trim() || "ধ্রুব সংসদ";
      await put("settings", { id:"orgName", key:"orgName", value:org });

  $("#changePwBtn").onclick = async () => {
    const oldVal = $("#oldPw").value;
    const newVal = $("#newPw").value;
    const confirmVal = $("#confirmPw").value;

    if(isMember){
      if(!member || oldVal !== member.localPassword){
        showAlertPopup("Current Password সঠিক নয়।");
        return;
      }
      if(newVal !== confirmVal){
        showAlertPopup("New Password এবং Confirm Password মিল না হলে Popup দেখাবে।");
        return;
      }
      if(newVal.length < 4){
        showAlertPopup("নতুন পাসওয়ার্ড কমপক্ষে ৪ অক্ষরের হতে হবে।");
        return;
      }
      if(cloudReady && member.authUid){
        const cloudChanged = await supaChangePasswordForSession(session, oldVal, newVal);
        if(!cloudChanged) return showAlertPopup("Supabase-এ Password পরিবর্তন করা যায়নি। Internet connection পরীক্ষা করুন।");
      }
      member.localPassword = newVal;
      member.updatedAt = Date.now();
      await put("members", member);
      await queue("updateMember", member);
      if(!cloudReady) await queue("changePassword", { role:"MEMBER", memberId:member.memberId, oldPassword:oldVal, newPassword:newVal });
    } else {
      const curAdminPw = get("adminPassword", "admin");
      if(session.username === "admin"){
        if(oldVal !== curAdminPw){
          showAlertPopup("Current Password সঠিক নয়।");
          return;
        }
        if(newVal !== confirmVal){
          showAlertPopup("New Password এবং Confirm Password মিল না হলে Popup দেখাবে।");
          return;
        }
        if(newVal.length < 4){
          showAlertPopup("নতুন পাসওয়ার্ড কমপক্ষে ৪ অক্ষরের হতে হবে।");
          return;
        }
        if(cloudReady){
          const cloudChanged = await supaChangePasswordForSession(session, oldVal, newVal);
          if(!cloudChanged) return showAlertPopup("Supabase-এ Password পরিবর্তন করা যায়নি। Internet connection পরীক্ষা করুন।");
        }
        await put("settings", { id:"adminPassword", key:"adminPassword", value:newVal });
        if(!cloudReady) await queue("changePassword", { role:"ADMIN", oldPassword:oldVal, newPassword:newVal });
      } else {
        let makers = await all("members");
        let mk = makers.find(x => x.type === "maker" && x.username === session.username);
        if(!mk || oldVal !== mk.localPassword){
          showAlertPopup("Current Password সঠিক নয়।");
          return;
        }
        if(newVal !== confirmVal){
          showAlertPopup("New Password এবং Confirm Password মিল না হলে Popup দেখাবে।");
          return;
        }
        if(cloudReady && mk.authUid){
          const cloudChanged = await supaChangePasswordForSession({ ...session, memberRecord:mk }, oldVal, newVal);
          if(!cloudChanged) return showAlertPopup("Supabase-এ Password পরিবর্তন করা যায়নি। Internet connection পরীক্ষা করুন।");
        }
        mk.localPassword = newVal;
        await put("members", mk);
        await queue("updateMember", mk);
        if(!cloudReady) await queue("changePassword", { role:"MAKER", username:mk.username, oldPassword:oldVal, newPassword:newVal });
      }
    }

    await log("Password Change Activity", "Password successfully changed");

    showAlertPopup("Password পরিবর্তন সফল হয়েছে!", true, async () => {
      await log("Login/Logout Activity", `Auto Logged Out after password change: ${session.username || session.memberId}`);
      session = null;
      try{ sessionStorage.removeItem("dhruvoSession"); }catch(e){}
      renderLogin();
    });
  };
}

/* Show/Hide Password Toggle Helper Function */
function togglePasswordVisibility(fieldId, btn){
  const field = document.getElementById(fieldId);
  if(field.type === "password"){
    field.type = "text";
    btn.style.color = "#5eaa7b";
  } else {
    field.type = "password";
    btn.style.color = "#6b7470";
  }
}

async function init(){
  try{
    applyTheme();
    await openDB();
    online = navigator.onLine;

    /* Supabase SDK loads asynchronously — wait briefly (max 3s, skips on CDN error)
       so the splash never lingers, then initialize. UI renders immediately after. */
    updateDbStatus(null); /* connecting */
    let supaWaited = 0;
    while(!window.supabase && !window.__dhruvoSupaCdnFailed && supaWaited < 3000){ await new Promise(r => setTimeout(r, 100)); supaWaited += 100; }
    supaInit();
    const ok = await cloudCheck();
    updateDbStatus(ok);
    /* If the SDK arrives late (slow network), start cloud sync without a page refresh. */
    const supaWatch = setInterval(async () => {
      if(supa){ clearInterval(supaWatch); return; }
      if(!window.supabase) return;
      clearInterval(supaWatch);
      try{
        if(!supaInit()) return;
        const ok2 = await cloudCheck();
        updateDbStatus(ok2);
        if(session && cloudReady) await startCloudAfterLogin(session.role);
      }catch(e){ console.warn("Late Supabase init", e); }
    }, 4000);

    /* Supabase password-recovery link: the URL contains ?type=recovery */
    if(supa && /type=recovery/.test(window.location.search)){
      const { data: rec } = await supa.auth.getSession();
      if(rec?.session){ showRecoveryForm(); return; }
    }

    /* 1) Auto session restore from the persisted Supabase Auth session */
    if(supa){
      const { data: sd } = await supa.auth.getSession();
      if(sd?.session){
        if(await restoreFromSupa(sd.session)){
          renderApp();
          if(cloudReady) startCloudAfterLogin(session.role);
        }
      }
    }

    /* 2) Fallback: locally cached session (offline restore) */
    if(!session){
      session = loadSession();
      if(session){
        if(session.memberRecordId && !session.memberRecord) session.memberRecord = await one("members", session.memberRecordId);
        renderApp();
        if(cloudReady) startCloudAfterLogin(session.role);
      }else{
        renderLogin();
        /* Keep the login-page connection status fresh */
        const statusUpdateInterval = setInterval(() => {
          updateDbStatus(lastDbState);
        }, 1000);
        window.addEventListener("loginSuccess", () => {
          clearInterval(statusUpdateInterval);
        }, { once:true });
      }
    }

    window.addEventListener("online", async () => {
      online = true;
      const ok2 = await cloudCheck();
      updateDbStatus(ok2);
      if(ok2){
        toast("Online / Cloud sync starting");
        try{ await migrateLocalToCloud(); await startRealtime(); await syncQueue(); await refreshCurrentView(); startReconcileTimer(); }catch(e){ console.warn("online sync", e); }
      }
    });
    window.addEventListener("offline", () => {
      online = false;
      updateDbStatus(false);
      toast("Offline / Local mode");
    });

    /* Periodic connection check for robustness */
    setInterval(async () => {
      const ok3 = await cloudCheck();
      updateDbStatus(ok3);
    }, 30000);
  }catch(e){
    console.error("Application initialization", e);
    try{ renderLogin(); }catch(_e){}
  }
}
init();
