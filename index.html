<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9f7ef">
<title>ধ্রুব সংসদ — Offline Management System</title>
<style>
  .db-status { font-size: 12px; margin: 8px 0; text-align: center; }
  .db-online { color: var(--online); }
  .db-offline { color: var(--offline); }
  .db-connecting { color: var(--muted); }
</style>
<style>
/* ===== Theme variables — Light (default) ===== */
:root{
 --bg:#f5f7f6; --surface:#ffffff; --surface-2:#fffdf3; --text:#202725; --muted:#6b7470;
 --border:#dfe7e2; --border-soft:#dce8e1; --input-border:#ccd8d2;
 --accent:#5eaa7b; --accent-text:#ffffff;
 --notice-bg:#eef7f1; --notice-border:#d4e9db;
 --error-bg:#fff0f0; --error-border:#f1c4c4; --error-text:#8b3030;
 --badge-active:#dcf4e5; --pending-bg:#fff1bf; --rejected-bg:#ffdede; --warn-bg:#fff0bd;
 --danger:#d86d6d;
 --table-head:#f2f7f4; --row-border:#e7ece9;
 --shadow:0 8px 28px #00000010; --overlay:rgba(0,0,0,0.4);
 --toast-bg:#202725; --toast-text:#ffffff;
 --login-a:#ffffff; --login-b:#f1faf5;
 --online:#2d8a57; --offline:#d88a35;
}
/* ===== AMOLED Dark — full black (#000000) background ===== */
:root[data-theme="dark"]{
 --bg:#000000; --surface:#0c1210; --surface-2:#111b16; --text:#e9f1ed; --muted:#8fa39a;
 --border:#1e2b25; --border-soft:#1e2b25; --input-border:#24352d;
 --accent:#35c97d; --accent-text:#04130b;
 --notice-bg:#0e1f17; --notice-border:#1c3529;
 --error-bg:#2a1414; --error-border:#4a2424; --error-text:#f0a3a3;
 --badge-active:#123527; --pending-bg:#3a3218; --rejected-bg:#3a1d1d; --warn-bg:#3a3218;
 --danger:#e06c6c;
 --table-head:#101a15; --row-border:#1a2620;
 --shadow:0 8px 28px rgba(0,0,0,0.65); --overlay:rgba(0,0,0,0.72);
 --toast-bg:#22312b; --toast-text:#e9f1ed;
 --login-a:#000000; --login-b:#070d0a;
 --online:#3ddc84; --offline:#e0a458;
}
/* System dark mode (when user has not chosen manually) */
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]):not([data-theme="dark"]){
  --bg:#000000; --surface:#0c1210; --surface-2:#111b16; --text:#e9f1ed; --muted:#8fa39a;
  --border:#1e2b25; --border-soft:#1e2b25; --input-border:#24352d;
  --accent:#35c97d; --accent-text:#04130b;
  --notice-bg:#0e1f17; --notice-border:#1c3529;
  --error-bg:#2a1414; --error-border:#4a2424; --error-text:#f0a3a3;
  --badge-active:#123527; --pending-bg:#3a3218; --rejected-bg:#3a1d1d; --warn-bg:#3a3218;
  --danger:#e06c6c;
  --table-head:#101a15; --row-border:#1a2620;
  --shadow:0 8px 28px rgba(0,0,0,0.65); --overlay:rgba(0,0,0,0.72);
  --toast-bg:#22312b; --toast-text:#e9f1ed;
  --login-a:#000000; --login-b:#070d0a;
  --online:#3ddc84; --offline:#e0a458;
 }
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(var(--login-a),var(--login-b))}
.login-card{width:min(390px,100%);background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.brand{text-align:center;font-size:22px;font-weight:700;margin-bottom:16px}
.sub{text-align:center;color:var(--muted);font-size:12px;margin-top:-10px;margin-bottom:16px}
.splash{min-height:100vh;display:grid;place-items:center;text-align:center;padding:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--input-border);border-radius:8px;padding:10px;background:var(--surface);color:var(--text);font-size:14px}
textarea{min-height:70px}
.primary{background:var(--accent);color:var(--accent-text)}
.danger{background:var(--danger);color:#fff}
.neutral{background:var(--surface);border:1px solid var(--border)}
.warn{background:var(--warn-bg)}
.theme-btn{min-width:40px;padding:8px 10px;font-size:15px;line-height:1}

.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border-soft);padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between}
.topbar strong{font-size:16px}
.userbox{display:flex;gap:6px;align-items:center;font-size:12px}

/* Top Tab Bar (desktop / tablet) */
.top-tab-bar{background:var(--surface);border-bottom:1px solid var(--border-soft);display:flex;overflow-x:auto;white-space:nowrap;padding:0 12px;gap:6px;-webkit-overflow-scrolling:touch;position:sticky;top:53px;z-index:4}
.top-tab-bar::-webkit-scrollbar{display:none}
.top-tab-btn{background:transparent;border:none;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;border-radius:0;min-height:44px;flex:0 0 auto}
.top-tab-btn:hover{color:var(--accent)}
.top-tab-btn.active-tab{color:var(--accent);border-bottom-color:var(--accent)}
.tab-icon{font-size:14px;margin-right:5px}
.tab-label{white-space:nowrap}

.layout{display:block;min-height:calc(100vh - 105px)}
.main{padding:12px;width:100%;max-width:none;margin:0}
.section-title{font-size:16px;font-weight:700;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.metric{font-size:20px;font-weight:700;margin-top:6px}
.muted{color:var(--muted);font-size:11px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.table-wrap{overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;-webkit-overflow-scrolling:touch}
.table{width:100%;border-collapse:collapse;min-width:680px;font-size:12px}
.table th,.table td{border-bottom:1px solid var(--row-border);padding:9px;text-align:left;white-space:nowrap}
.table th{background:var(--table-head);font-size:11px}
.table button{min-height:34px;padding:6px 10px}
.badge{display:inline-block;padding:4px 8px;border-radius:10px;font-size:10px}
.active{background:var(--badge-active)}
.pending{background:var(--pending-bg)}
.rejected{background:var(--rejected-bg)}
.due{background:var(--rejected-bg)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.notice{padding:10px;border-radius:8px;background:var(--notice-bg);border:1px solid var(--notice-border);margin:10px 0;font-size:12px}
.notice-error{background:var(--error-bg);border-color:var(--error-border);color:var(--error-text)}
.profile-hero{background:linear-gradient(135deg,var(--notice-bg),var(--bg))}
.modal{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:12px;z-index:20}
.modal-card{width:min(520px,100%);background:var(--surface);border-radius:14px;padding:18px;max-height:90vh;overflow-y:auto}
.toast{position:fixed;right:12px;bottom:12px;background:var(--toast-bg);color:var(--toast-text);padding:10px 14px;border-radius:8px;z-index:50;font-size:12px}

/* Custom Alert Modal Style */
.alert-modal{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:12px;z-index:9999}
.alert-card{width:min(320px,100%);background:var(--surface);border-radius:12px;padding:20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
.alert-card h3{margin:0 0 10px;color:var(--danger);font-size:18px}
.alert-card p{margin:0 0 16px;color:var(--text);font-size:13px}

/* Password Toggle Wrapper Style */
.password-field-wrap{position:relative;display:flex;align-items:center}
.password-field-wrap input{width:100%;padding-right:38px}
.password-toggle-btn{position:absolute;right:10px;background:transparent;border:none;cursor:pointer;padding:4px;font-size:15px;color:var(--muted)}

/* ===== Mobile: bottom tab navigation + large touch targets ===== */
@media(max-width:760px){
 .top-tab-bar{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:6;border-bottom:none;border-top:1px solid var(--border-soft);padding:0 2px calc(2px + env(safe-area-inset-bottom,0px));gap:0;box-shadow:0 -4px 18px rgba(0,0,0,0.10)}
 .top-tab-btn{flex:1 1 0;min-width:0;padding:7px 1px 6px;font-size:9.5px;display:flex;flex-direction:column;align-items:center;gap:2px;justify-content:flex-start;border-bottom:none;border-top:3px solid transparent;min-height:56px}
 .tab-icon{font-size:20px;margin:0;line-height:1}
 .tab-label{white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;line-height:1.15;text-align:center;max-width:100%}
 .top-tab-btn.active-tab{border-top-color:var(--accent)}
 .layout{min-height:calc(100vh - 53px)}
 .main{padding:10px;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
 .grid{grid-template-columns:repeat(2, 1fr)}
 .form-grid{grid-template-columns:1fr}
 .userbox span{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .table{min-width:560px}
 .actions button{min-height:46px;flex:1;text-align:center}
 .login-card button{min-height:46px}
 .field input,.field select{min-height:46px;font-size:16px}
 .field textarea{font-size:16px}
 .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
 .topbar{gap:8px}
}
@media(max-width:420px){
 .grid{grid-template-columns:1fr}
 .actions button{flex:1;text-align:center}
}
</style>
</head>

<script>
/* Supabase Configuration — Publishable Key ONLY.
   No service role key / secret key / admin key — কখনো frontend-এ রাখা যাবে না। */
window.DHRUVO_SUPABASE_CONFIG = {
  url: "https://fegxtzxlowhmbizlbzma.supabase.co",
  publishableKey: "sb_publishable_b2UcygpdgxR8WP7LprAEXg_rl1kOMIr"
  /* Supabase Auth (email/password) is OPTIONAL and OFF by default.
     ডাটা + live sync আসলে public RLS + publishable key দিয়েই চলে, তাই Auth দরকার নেই।
     Auth কে লাগলে শুধু নিচের লাইনটি আন-কমেন্ট করুন এবং Supabase-এ email signup চালু করুন:
  , useAuth: true
  */
};
/* Splash watchdog: if the app has not booted within 9 seconds (slow/blocked network),
   show a helpful message instead of a blank page. */
window.__dhruvoSplashTimer = setTimeout(function(){
  if(!window.__dhruvoBooted){
    var a = document.getElementById("app");
    if(a){ a.innerHTML = '<div class="splash"><div class="brand">ধ্রুব সংসদ</div><div class="sub">লোডে দেরি হচ্ছে। ইন্টারনেট কানেকশন চেক করে পেইজটি আবার খুলুন (Refresh)।</div></div>'; }
  }
}, 9000);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" async onerror="window.__dhruvoSupaCdnFailed=true"></script>
<script>

/* ============================================================
   SUPABASE CLOUD / OFFLINE-FIRST INTEGRATION LAYER
   (পুরনো cloud SDK সম্পূর্ণ অপসারণ করা হয়েছে — এখন শুধু Supabase)
   Existing IndexedDB remains the primary local cache.
   Supabase (REST + Auth + Realtime) is the cloud source/sync target.
   ============================================================ */
/* App core is booting — cancel the splash watchdog (blank page should never be visible). */
window.__dhruvoBooted = true;
try{ if(window.__dhruvoSplashTimer) clearTimeout(window.__dhruvoSplashTimer); }catch(e){}

const SUPABASE_URL = window.DHRUVO_SUPABASE_CONFIG?.url || "https://fegxtzxlowhmbizlbzma.supabase.co";
const SUPABASE_KEY = window.DHRUVO_SUPABASE_CONFIG?.publishableKey || "sb_publishable_b2UcygpdgxR8WP7LprAEXg_rl1kOMIr";

let supa = null, supaSec = null;      // main + secondary auth client
let cloudReady = false, online = navigator.onLine, lastDbState = null;
let realtimeChannel = null, rtStarted = false, reconcileTimer = null, syncBusy = false;
let suppressCloudQueue = false;
let logoutInProgress = false;
let refreshTimer = null;
let lastAuthError = null;             // most recent Supabase auth error (for diagnosis)

/* Auth mode. The app's data + realtime run over public RLS + the publishable
   (anon) key, so NO Supabase Auth session is required to read/write/live-sync.
   That means the potentially-fragile email/password Auth account creation is
   OPTIONAL and is OFF by default. When off, login is app-local (password held
   in IndexedDB) and everything still syncs live — so errors like
   "email_provider_disabled", "email not confirmed", "already registered"
   simply never appear. Set window.DHRUVO_USE_SUPABASE_AUTH = true to turn it on. */
let authEnabled = !!(window && window.DHRUVO_USE_SUPABASE_AUTH === true
                    || window && window.DHRUVO_SUPABASE_CONFIG && window.DHRUVO_SUPABASE_CONFIG.useAuth === true);

/* Synthetic Supabase Auth emails — same scheme as the previous system */
const ADMIN_EMAIL = "admin@admin.dhruvo-sangsad.local";
function emailPrefix(s){ s = String(s || "").toLowerCase().replace(/[^a-z0-9._-]/g, ""); return s || "x"; }
const emailForMember = m => `${emailPrefix(m?.memberId || m?.id)}@auth.dhruvo-sangsad.local`;
const emailForMaker  = m => `${emailPrefix(m?.username || m?.id)}@maker.dhruvo-sangsad.local`;
/* Supabase enforces a 6-character minimum password. Short local passwords
   (the app allows 4+) get a deterministic cloud-only suffix so the cloud
   account always works while the user keeps typing their real password. */
function deriveCloudPw(pw){ pw = String(pw == null ? "" : pw); return pw.length >= 6 ? pw : pw + "#dhruvo"; }

/* Local store name -> Supabase table */
const TABLE_MAP = { members:"members", deposits:"deposits", notifications:"notifications", activityLogs:"activity_logs", settings:"settings" };

function ms(v){ if(v==null || v==="")return 0; const t = typeof v==="number" ? v : (typeof v==="string" ? Date.parse(v) : new Date(v).getTime()); return isNaN(t) ? 0 : t; }
function iso(v){ if(!v)return null; const d = new Date(typeof v==="number" ? v : v); return isNaN(d.getTime()) ? null : d.toISOString(); }
function isoFromDmy(s){ if(!s)return null; const p = String(s).trim().split("-"); if(p.length!==3)return null; return `${p[2]}-${p[1]}-${p[0]}`; }
function dmyFromIso(s){ if(!s)return null; const p = String(s).slice(0,10).split("-"); if(p.length!==3)return null; return `${p[2]}-${p[1]}-${p[0]}`; }

function supaInit(){
  if(!window.supabase || !window.supabase.createClient) return false;
  try{
    /* Auth is OFF in this build. Purge any leftover Supabase auth state from
       an older build (or a failed prior attempt) on the SAME device so it can
       never interfere with the app-local login or the public-RLS data sync. */
    if(!authEnabled){
      try{ localStorage.removeItem("dhruvoSupabaseAuth"); }catch(e){}
      try{ localStorage.removeItem("dhruvoSupabaseAuthSecondary"); }catch(e){}
      try{ sessionStorage.removeItem("dhruvoSupabaseAuth"); }catch(e){}
      try{ sessionStorage.removeItem("dhruvoSupabaseAuthSecondary"); }catch(e){}
    }
    supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { storageKey:"dhruvoSupabaseAuth", persistSession:!!authEnabled, autoRefreshToken:!!authEnabled, detectSessionInUrl:!!authEnabled }
    });
    /* Secondary client — background account creation / password change,
       without touching the main user's session (same pattern as before). */
    supaSec = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { storageKey:"dhruvoSupabaseAuthSecondary", persistSession:!!authEnabled, autoRefreshToken:false, detectSessionInUrl:false }
    });
    if(authEnabled){
      supa.auth.onAuthStateChange(event => {
        if(event === "SIGNED_OUT" && session && !logoutInProgress){
          stopRealtime(); stopReconcileTimer();
          session = null;
          try{ sessionStorage.removeItem("dhruvoSession"); }catch(e){}
          renderLogin();
        }
      });
    }
    return true;
  }catch(e){
    console.error("Supabase init", e);
    return false;
  }
}

/* ---------------- Database connection status ---------------- */
async function cloudCheck(){
  if(!navigator.onLine) return false;
  try{
    await fetch(SUPABASE_URL + "/rest/v1/settings?select=key&limit=1", { headers:{ apikey:SUPABASE_KEY, "Authorization":"Bearer " + SUPABASE_KEY } });
    return true; /* any HTTP response = database reachable */
  }catch(e){ return false; }
}
function updateDbStatus(state){
  if(state === true) cloudReady = true;
  else if(state === false) cloudReady = false;
  if(state !== null) lastDbState = state;
  const topEl = document.getElementById("dbStatus");
  if(topEl){ topEl.textContent = cloudReady ? "● Cloud Online" : "● Offline / Local"; topEl.style.color = cloudReady ? "var(--online)" : "var(--offline)"; }
  const loginEl = document.getElementById("dbLoginStatus");
  if(loginEl){
    if(state === null){ loginEl.textContent = "⚪ Database Connecting..."; loginEl.className = "db-status db-connecting"; }
    else if(cloudReady){ loginEl.textContent = "🟢 Database Connected"; loginEl.className = "db-status db-online"; }
    else { loginEl.textContent = "🔴 Database Offline"; loginEl.className = "db-status db-offline"; }
  }
  if(state === true){ try{ syncQueue(); }catch(e){} }
}
function addDbStatusToTopbar(){
  const tb = document.querySelector(".topbar .userbox");
  if(!tb) return;
  if(!document.getElementById("dbStatus")){
    const s = document.createElement("span");
    s.id = "dbStatus";
    s.style.cssText = "font-size:11px;font-weight:700;margin-right:4px";
    s.textContent = cloudReady ? "● Cloud Online" : "● Offline / Local";
    s.style.color = cloudReady ? "var(--online)" : "var(--offline)";
    tb.insertBefore(s, tb.firstChild);
  }
}

/* ---------------- Row mapping (local camelCase <-> Supabase snake_case) ---------------- */
function memberCloudToLocal(c){
  return {
    id:c.id, memberId:c.member_id,
    nameBn:c.name_bn, nameEn:c.name_en,
    fatherBn:c.father_bn, fatherEn:c.father_en,
    motherBn:c.mother_bn, motherEn:c.mother_en,
    mobile:c.mobile, whatsapp:c.whatsapp, email:c.email, nid:c.nid, dob:c.dob,
    profession:c.profession, address:c.address,
    monthlyInstallment:Number(c.monthly_installment || 0),
    status:c.status, type:c.type,
    username:c.username || undefined,
    authUid:c.auth_uid || null,
    createdAt:ms(c.created_at) || undefined,
    updatedAt:ms(c.updated_at) || undefined
  };
}
function memberLocalToCloud(m){
  return {
    id:m.id, member_id:m.memberId,
    name_bn:m.nameBn, name_en:m.nameEn,
    father_bn:m.fatherBn, father_en:m.fatherEn,
    mother_bn:m.motherBn, mother_en:m.motherEn,
    mobile:m.mobile, whatsapp:m.whatsapp, email:m.email, nid:m.nid, dob:m.dob,
    profession:m.profession, address:m.address,
    monthly_installment:Number(m.monthlyInstallment || 0),
    status:m.status, type:m.type,
    username:m.username || null,
    auth_uid:m.authUid || null,
    created_at:ms(m.createdAt),
    updated_at:ms(m.updatedAt || m.createdAt) || Date.now()
  };
}
function depositCloudToLocal(c){
  return {
    id:c.id, memberId:c.member_id, memberName:c.member_name,
    date:dmyFromIso(c.deposit_date) || c.date || "",
    type:c.type, description:c.description,
    amount:Number(c.amount || 0),
    paymentMethod:c.payment_method, paymentDetail:c.payment_detail,
    cashDepositor:c.cash_depositor, bankMethod:c.bank_method, mobileMethod:c.mobile_method,
    reference:c.reference, note:c.note,
    submittedBy:c.submitted_by, submittedAt:ms(c.submitted_at) || undefined,
    status:c.status, reviewedBy:c.reviewed_by, reviewedAt:ms(c.reviewed_at) || undefined,
    createdAt:ms(c.created_at) || undefined, updatedAt:ms(c.updated_at) || undefined
  };
}
function depositLocalToCloud(d){
  return {
    id:d.id, member_id:d.memberId, member_name:d.memberName,
    date:d.date || null,
    deposit_date:isoFromDmy(d.date),
    type:d.type, description:d.description,
    amount:Number(d.amount || 0),
    payment_method:d.paymentMethod, payment_detail:d.paymentDetail,
    cash_depositor:d.cashDepositor || null, bank_method:d.bankMethod || null, mobile_method:d.mobileMethod || null,
    reference:d.reference || null, note:d.note,
    submitted_by:d.submittedBy, submitted_at:ms(d.submittedAt),
    status:d.status, reviewed_by:d.reviewedBy || null, reviewed_at:ms(d.reviewedAt),
    created_at:ms(d.createdAt || d.submittedAt),
    updated_at:ms(d.updatedAt || d.createdAt || d.submittedAt) || Date.now()
  };
}
function notificationCloudToLocal(c){
  return { id:c.id, message:c.message, audience:c.audience, type:c.type, memberId:c.member_id, depositId:c.deposit_id,
           createdAt:ms(c.created_at) || undefined, updatedAt:ms(c.updated_at) || undefined };
}
function notificationLocalToCloud(n){

           member_id:n.memberId || null, deposit_id:n.depositId || null,
           created_at:ms(n.createdAt) || Date.now(), updated_at:ms(n.updatedAt || n.createdAt) || Date.now() };
}
function logCloudToLocal(c){
  return { id:c.id, user:c.user, role:c.role, action:c.action, details:c.details, date:c.date, time:c.time,
           createdAt:ms(c.created_at) || undefined, updatedAt:ms(c.updated_at) || undefined };
}
function logLocalToCloud(l){
  return { id:l.id, user:l.user, role:l.role, action:l.action, details:l.details, date:l.date, time:l.time,
           created_at:ms(l.createdAt) || Date.now(), updated_at:ms(l.updatedAt || l.createdAt) || Date.now() };
}
function settingCloudToLocal(c){
  return { id:c.id, key:c.key, value:c.value, updatedAt:ms(c.updated_at) || undefined };
}
function settingLocalToCloud(s){
  return { id:s.id, key:s.key, value:s.value, updated_at:ms(s.updatedAt || s.createdAt) || Date.now() };

function cloudToLocal(store, row){
  if(store === "members")return memberCloudToLocal(row);
  if(store === "deposits")return depositCloudToLocal(row);
  if(store === "notifications")return notificationCloudToLocal(row);
  if(store === "activityLogs")return logCloudToLocal(row);
  if(store === "settings")return settingCloudToLocal(row);
  return row;
}
function localToCloud(store, rec){
  if(store === "members")return memberLocalToCloud(rec);
  if(store === "deposits")return depositLocalToCloud(rec);
  if(store === "notifications")return notificationLocalToCloud(rec);
  if(store === "activityLogs")return logLocalToCloud(rec);
  if(store === "settings")return settingLocalToCloud(rec);
  return rec;

/* Fields that exist only in the local cache (no Supabase column).
   They are preserved when a cloud row is merged into IndexedDB. */
const LOCAL_ONLY_FIELDS = ["localPassword","approvedAt","approvedBy","rejectedAt","rejectedBy","editedBy"];
async function mergeCloudRow(store, row){
  const mapped = cloudToLocal(store, row);
  if(mapped && mapped.id){
    const local = await one(store, mapped.id);
    if(local) LOCAL_ONLY_FIELDS.forEach(k => { if(local[k] !== undefined && (mapped[k] === undefined || mapped[k] === null)) mapped[k] = local[k]; });
  }
  await put(store, mapped);
}

/* ---------------- Cloud CRUD (Supabase REST) ---------------- */
async function cloudWrite(store, record){
  if(!supa) return false;
  if(store === "settings" && record?.key === "adminPassword") return false; /* never upload the admin secret to the cloud */
  const { error } = await supa.from(TABLE_MAP[store]).upsert(localToCloud(store, record), { onConflict:"id" });
  if(error) throw error;
  return true;
}
async function cloudDelete(store, recordId){
  if(!supa || !recordId) return false;
  const { error } = await supa.from(TABLE_MAP[store]).delete().eq("id", recordId);
  if(error) throw error;
  return true;
}
function rowMatchesMemberScope(store, row){
  if(!session) return false;
  if(store === "members")return row.member_id === session.memberId || row.id === session.memberRecordId;
  if(store === "deposits")return row.member_id === session.memberId;
  if(store === "notifications")return row.audience === "member" && row.member_id === session.memberId;
  if(store === "activityLogs")return row.user === session.memberId || row.user === session.username;
  return false;
}
function rowMatchesSession(store, row){
  if(!session) return false;
  if(role(session) !== "MEMBER") return true;
  return rowMatchesMemberScope(store, row);
}
async function cloudPullStore(store){
  if(!supa || !cloudReady) return 0;
  let q = supa.from(TABLE_MAP[store]).select("*");
  if(role(session) === "MEMBER"){
    if(store === "members")q = q.eq("member_id", session.memberId);
    else if(store === "deposits")q = q.eq("member_id", session.memberId);
    else if(store === "notifications")q = q.eq("member_id", session.memberId);
    else if(store === "activityLogs")q = q.eq("user", session.memberId);
    else return 0;
  }
  const { data, error } = await q;
  if(error) throw error;
  const rows = data || [];
  let count = 0;
  for(const row of rows){
    if(!row || !row.id) continue;
    /* Never pull the admin password from cloud — it is device-local only.
       An older build may have uploaded it; ignoring it prevents a stale value
       from breaking login on a fresh device. */
    if(store === "settings" && row.key === "adminPassword") continue;
    if(role(session) === "MEMBER" && !rowMatchesMemberScope(store, row)) continue;
    const local = await one(store, row.id);
    if(!local || ms(row.updated_at || row.created_at) >= ms(local.updatedAt || local.createdAt)){
      suppressCloudQueue = true;
      try{ await mergeCloudRow(store, row); }finally{ suppressCloudQueue = false; }
      count++;
    }
  }
  return count;
}
async function cloudPullAll(){
  if(!supa || !cloudReady) return {};
  const list = role(session) === "MEMBER"
    ? ["members","deposits","notifications","activityLogs"]
    : ["members","deposits","notifications","activityLogs","settings"];
  const result = {};
  for(const store of list){
    try{ result[store] = await cloudPullStore(store); }catch(e){ console.warn("Cloud pull", store, e); }
  }
  return result;
}
async function cloudStoreCount(store){
  if(!supa || !cloudReady) return 0;
  try{
    const { count, error } = await supa.from(TABLE_MAP[store]).select("*", { count:"exact", head:true });
    if(error) return 0;
    return count || 0;
  }catch(e){ return 0; }
}

/* ---------------- Supabase Auth account helpers ---------------- */
function profileAttrsForRecord(r){
  return { role: r?.type === "maker" ? "MAKER" : "MEMBER", memberId: r?.memberId || null, username: r?.username || null, displayName: r?.nameBn || r?.nameEn || null };
}
function profileAttrsForSession(s){
  return { role: s.role, memberId: s.memberId || s.memberRecord?.memberId || null,
           username: s.username || s.memberRecord?.username || null,
           displayName: s.displayName || s.memberRecord?.nameBn || s.memberRecord?.nameEn || null };
}
async function fetchProfile(client, uid){
  try{
    const r1 = await client.from("profiles").select("*").eq("uid", uid).maybeSingle();
    if(r1.data && !r1.error) return r1.data;
    const r2 = await client.from("profiles").select("*").eq("id", uid).maybeSingle();
    if(r2.data && !r2.error) return r2.data;
  }catch(e){ console.warn("fetchProfile", e); }
  return null;
}
async function ensureProfileForClient(client, uid, attrs){
  if(!client || !uid) return null;
  try{
    const row = await fetchProfile(client, uid);
    if(row) return row;
    const payload = { role:attrs.role, member_id:attrs.memberId || null, username:attrs.username || null, display_name:attrs.displayName || null,
                      created_at:Date.now(), updated_at:Date.now() };
    let ins = await client.from("profiles").insert({ uid, ...payload });
    if(ins.error) ins = await client.from("profiles").insert({ id:uid, ...payload });
    if(ins.error) console.warn("profile insert", ins.error);
    return null;
  }catch(e){ console.warn("profile ensure", e); return null; }
}
/* Create the member/maker's Supabase Auth account (secondary client) and
   recover the UID if the account already exists. */
async function ensureAuthForRecord(record){
  if(!authEnabled) return null;
  if(!supaSec || !cloudReady) return null;
  if(record?.authUid) return record.authUid;
  if(!record?.localPassword) return null;
  const email = record.type === "maker" ? emailForMaker(record) : emailForMember(record);
  try{
    const cpw = deriveCloudPw(record.localPassword);
    let res = await supaSec.auth.signUp({ email, password:cpw });
    if(res.error){
      if(/already (been )?registered/i.test(String(res.error.message || res.error.description || ""))){
        res = await supaSec.auth.signInWithPassword({ email, password:cpw });
      }
      if(res.error) return null;
    }
    const uid = res.data?.user?.id || res.data?.session?.user?.id;
    if(!uid) return null;
    record.authUid = uid;
    try{ await ensureProfileForClient(supaSec, uid, profileAttrsForRecord(record)); }catch(e){}
    try{ await supaSec.auth.signOut(); }catch(e){}
    return uid;
  }catch(e){
    console.warn("auth create", e);
    try{ await supaSec.auth.signOut(); }catch(_e){}
    return null;
  }
}
/* Password change via secondary client: sign in with the old password,
   update it, then sign the secondary client out. */
async function supaChangePassword(email, oldPw, newPw){
  /* Auth is optional: passwords are app-local, so a "change" is always OK. */
  if(!authEnabled) return true;
  if(!supaSec || !cloudReady) return false;
  try{
    const { error } = await supaSec.auth.signInWithPassword({ email, password:deriveCloudPw(oldPw) });
    if(error){ try{ await supaSec.auth.signOut(); }catch(_e){} return false; }
    const { error: updErr } = await supaSec.auth.updateUser({ password:deriveCloudPw(newPw) });
    try{ await supaSec.auth.signOut(); }catch(_e){}
    return !updErr;
  }catch(e){
    console.warn("Supabase password change", e);
    try{ await supaSec.auth.signOut(); }catch(_e){}
    return false;
  }
}
async function supaChangePasswordForSession(s, oldPw, newPw){
  if(!cloudReady) return false;
  let email = null;
  if(s.role === "ADMIN")email = ADMIN_EMAIL;
  else if(s.role === "MEMBER" && s.memberRecord)email = emailForMember(s.memberRecord);
  else if(s.role === "MAKER" && s.memberRecord)email = emailForMaker(s.memberRecord);
  if(!email) return false;
  return supaChangePassword(email, oldPw, newPw);
}

/* ---------------- Supabase login flows ---------------- */
async function supaAdminLogin(pw){
  /* Auth is optional. When off, login is app-local and data sync runs over
     public RLS, so we report success (no account creation, no errors). */
  if(!authEnabled) return true;
  if(!supa){ lastAuthError = new Error("Supabase SDK not loaded"); return false; }
  const cpw = deriveCloudPw(pw);
  let data = null;
  try{
    let res = await supa.auth.signInWithPassword({ email:ADMIN_EMAIL, password:cpw });
    if(res.error){
      lastAuthError = res.error;
      /* First-run bootstrap: the admin Supabase Auth account may not exist yet. */
      const ss = await supa.auth.signUp({ email:ADMIN_EMAIL, password:cpw });
      if(ss.error){
        lastAuthError = ss.error;
        console.warn("admin bootstrap", ss.error);
        /* Account already exists but sign-in failed (e.g. confirm-email / password).
           Do NOT hard-fail here — the caller still proceeds with a local session
           and data sync works over public RLS. */
        return false;
      }
      data = ss.data; lastAuthError = null;
    } else {
      data = res.data; lastAuthError = null;
    }
  }catch(e){ lastAuthError = e; console.warn("Supabase admin login", e); return false; }
  const uid = data?.user?.id;
  if(!uid){ lastAuthError = new Error("No user id returned"); return false; }
  try{ await ensureProfileForClient(supa, uid, { role:"ADMIN", memberId:null, username:"admin", displayName:"Admin" }); }catch(e){ console.warn("profile", e); }
  return true;
}
async function supaCredentialLogin(email, pw, record){
  /* Auth is optional. When off, skip Supabase Auth entirely and treat as
     success so login never blocks on account-creation/confirmation issues. */
  if(!authEnabled) return true;
  if(!supa){ lastAuthError = new Error("Supabase SDK not loaded"); return false; }
  const cpw = deriveCloudPw(pw);
  try{
    let { data, error } = await supa.auth.signInWithPassword({ email, password:cpw });
    if(error){
      lastAuthError = error;
      /* The Supabase Auth account may not exist yet — create it from the record's password. */
      if(record && record.localPassword){
        const u = await ensureAuthForRecord({ ...record });
        if(u){
          if(record.id) record.authUid = u;
          ({ data, error } = await supa.auth.signInWithPassword({ email, password:cpw }));
          if(error) lastAuthError = error;
        }
      }
      if(error) return false;
    } else { lastAuthError = null; }
    const uid = data?.user?.id;
    if(!uid){ lastAuthError = new Error("No user id returned"); return false; }
    if(record){
      record.authUid = uid;
      try{ suppressCloudQueue = true; await put("members", record); suppressCloudQueue = false; }catch(e){}
    }
    try{ await ensureProfileForClient(supa, uid, profileAttrsForRecord(record || {})); }catch(e){ console.warn("profile", e); }
    return true;
  }catch(e){ lastAuthError = e; console.warn("Supabase credential login", e); return false; }
}
/* Online is authoritative for Member authentication: the member does not
   have to be cached on this device yet. */
async function supaMemberDirectLogin(uid, pw, localMember){
  if(!supa || !cloudReady) return null;
  try{
    const { data, error } = await supa.from("members").select("*").or(`member_id.eq.${uid},mobile.eq.${uid}`).limit(1);
    if(error || !data || !data[0]) return null;
    const cloudMember = memberCloudToLocal(data[0]);
    if(!cloudMember || cloudMember.status !== "active") return null;
    const rec = (localMember && (localMember.localPassword || localMember.authUid))
      ? { ...cloudMember, localPassword: localMember.localPassword, authUid: localMember.authUid || cloudMember.authUid }
      : cloudMember;
    /* Establish the Supabase Auth session (best-effort). Even if it fails
       (e.g. confirm-email ON), the member record is valid and public RLS allows
       data access — so return the member so login can proceed without a hard stop. */
    const ok = await supaCredentialLogin(emailForMember(rec), pw, rec);
    return { ...cloudMember, authUid: rec.authUid || cloudMember.authUid };
  }catch(e){ console.warn("Supabase member direct login", e); return null; }
}
/* If the local session was created while offline, silently establish the
   Supabase Auth session when the network is back. */
async function establishCloudSession(){
  /* Auth is optional: no Supabase session to establish. Data sync uses the
     publishable key over public RLS. */
  if(!authEnabled) return true;
  if(!supa || !cloudReady || !session) return false;
  try{
    const cur = await supa.auth.getSession();
    if(cur.data?.session) return true;
    let email = null;
    if(session.role === "ADMIN")email = ADMIN_EMAIL;
    else if(session.role === "MEMBER")email = emailForMember({ memberId: session.memberId });
    else if(session.role === "MAKER")email = emailForMaker({ username: session.username });
    let pw = session.password || null;
    if(!pw){
      if(session.role === "ADMIN")pw = ((await all("settings")).find(x => x.key === "adminPassword")?.value) || "admin";
      else if(session.memberRecord?.localPassword)pw = session.memberRecord.localPassword;
    }
    if(!email || !pw) return false;
    let { data, error } = await supa.auth.signInWithPassword({ email, password:deriveCloudPw(pw) });
    if(error){
      if(session.role === "ADMIN"){
        const s = await supa.auth.signUp({ email, password:deriveCloudPw(pw) });
        if(s.error) return false;
        data = s.data;
      }else if(session.memberRecord?.localPassword){
        await ensureAuthForRecord(session.memberRecord);
        ({ data, error } = await supa.auth.signInWithPassword({ email, password:deriveCloudPw(pw) }));
        if(error) return false;
      }else return false;
    }
    const uid = data?.user?.id;
    if(!uid) return false;
    session.authUid = uid;
    await ensureProfileForClient(supa, uid, profileAttrsForSession(session));
    return true;
  }catch(e){ console.warn("establishCloudSession", e); return false; }
}
/* Restore the app session from a persisted Supabase Auth session.
   Role is read from the profiles table (fallback: members table). */
async function restoreFromSupa(supaSession){
  /* Auth is optional: sessions are app-local, so never restore from Supabase. */
  if(!authEnabled) return false;
  try{
    const uid = supaSession.user?.id;
    if(!uid) return false;
    const prof = await fetchProfile(supa, uid);
    const pr = prof?.role || "";
    if(pr === "ADMIN"){
      session = { username:"admin", role:"ADMIN", authUid:uid };
    }else if(pr === "MAKER"){
      let mk = null;
      const localMs = await all("members");
      mk = localMs.find(x => x.type === "maker" && x.authUid === uid);
      if(!mk){
        const { data } = await supa.from("members").select("*").eq("auth_uid", uid).limit(1);
        if(data && data[0]) mk = memberCloudToLocal(data[0]);
      }
      if(!mk){ try{ await supa.auth.signOut(); }catch(e){} return false; }
      session = { username:mk.username, role:"MAKER", makerId:mk.id, memberRecordId:mk.id, memberRecord:mk, authUid:uid };
    }else{
      let m = null;
      const localMs = await all("members");
      m = localMs.find(x => x.type !== "maker" && x.authUid === uid);
      if(!m && prof?.member_id){
        const { data } = await supa.from("members").select("*").eq("member_id", prof.member_id).limit(1);
        if(data && data[0]) m = memberCloudToLocal(data[0]);
      }
      if(!m){
        const { data } = await supa.from("members").select("*").eq("auth_uid", uid).limit(1);
        if(data && data[0]) m = memberCloudToLocal(data[0]);
      }
      if(!m){ try{ await supa.auth.signOut(); }catch(e){} return false; }
      session = { username:m.memberId, displayName:m.nameBn || m.nameEn || m.memberId, role:"MEMBER",
                  memberId:m.memberId, memberRecordId:m.id, memberRecord:m, authUid:uid };
    }
    saveSession();
    return true;
  }catch(e){ console.warn("restoreFromSupa", e); return false; }
}

/* ---------------- Realtime (single channel, no duplicate listeners) ---------------- */
function stopRealtime(){
  if(realtimeChannel){
    try{ supa.removeChannel(realtimeChannel); }catch(e){}
    realtimeChannel = null;
  }
  rtStarted = false;
}
async function startRealtime(){
  if(rtStarted || !supa || !cloudReady || !session) return;
  rtStarted = true;
  try{
    const stores = role(session) === "MEMBER"
      ? ["members","deposits","notifications","activityLogs"]
      : ["members","deposits","notifications","activityLogs","settings"];
    const ch = supa.channel("dhruvo-realtime");
    for(const store of stores){
      ch.on("postgres_changes", { event:"*", schema:"public", table:TABLE_MAP[store] }, async payload => {
        try{
          if(payload.eventType === "DELETE"){
            const oldRow = payload.old || {};
            if(!oldRow.id) return;
            if(!rowMatchesSession(store, oldRow)) return;
            const local = await one(store, oldRow.id);
            if(local){
              suppressCloudQueue = true;
              try{ await del(store, oldRow.id); }finally{ suppressCloudQueue = false; }
              scheduleRefresh();
            }
            return;
          }
          const row = payload.new || payload.old;
          if(!row || !row.id) return;
          if(!rowMatchesSession(store, row)) return;
          const local = await one(store, row.id);
          const remoteTime = ms(row.updated_at || row.created_at);
          const localTime = local ? ms(local.updatedAt || local.createdAt) : 0;
          if(!local || remoteTime >= localTime){
            suppressCloudQueue = true;
            try{ await mergeCloudRow(store, row); }finally{ suppressCloudQueue = false; }
            scheduleRefresh();
          }
        }catch(e){ console.warn("Realtime listener", store, e); }
      });
    }
    realtimeChannel = ch;
    ch.subscribe(status => {
      if(status && String(status) !== "SUBSCRIBED" && String(status).startsWith("CHANNEL")) console.warn("Realtime channel status", status);
    });
  }catch(e){
    console.warn("Realtime start", e);
    rtStarted = false;
    realtimeChannel = null;
  }
}
function scheduleRefresh(){
  if(refreshTimer) return;
  refreshTimer = setTimeout(() => { refreshTimer = null; refreshCurrentView(); }, 400);
}

/* ---------------- Bootstrap / merge / sync queue ---------------- */
function startReconcileTimer(){
  if(reconcileTimer) return;
  reconcileTimer = setInterval(async () => {
    if(!cloudReady || !online || !session) return;
    try{ await cloudPullAll(); await syncQueue(); await refreshCurrentView(); }catch(e){ console.warn("Cloud reconcile", e); }
  }, 10000);
}
function stopReconcileTimer(){
  if(reconcileTimer){ clearInterval(reconcileTimer); reconcileTimer = null; }
}
async function mergeLocalToCloud(){
  if(!supa || !cloudReady) return;
  const storesToMerge = ["members","deposits","notifications","activityLogs","settings"];
  for(const store of storesToMerge){
    const rows = await all(store);
    for(const row of rows){
      if(store === "settings" && (row.key === "adminPassword" || row.key === "cloudMigrationComplete")) continue;
      try{
        const { data } = await supa.from(TABLE_MAP[store]).select("*").eq("id", row.id).maybeSingle();
        const cloud = data && data[0];
        const localTime = ms(row.updatedAt || row.createdAt);
        const cloudTime = cloud ? ms(cloud.updated_at || cloud.created_at) : 0;
        if(!cloud || localTime > cloudTime){
          if(store === "members" && row.localPassword && !row.authUid){
            const uid = await ensureAuthForRecord(row);
            if(uid){ row.authUid = uid; row.updatedAt = Date.now(); suppressCloudQueue = true; try{ await put("members", row); }finally{ suppressCloudQueue = false; } }
          }
          await cloudWrite(store, row);
        }else if(cloud && cloudTime >= localTime){
          suppressCloudQueue = true;
          try{ await mergeCloudRow(store, cloud); }finally{ suppressCloudQueue = false; }
        }
      }catch(e){ console.warn("cloud merge", store, row.id, e); }
    }
  }
}
async function bootstrapCloudSync(){
  if(!cloudReady || !online || !session) return false;
  try{
    /* If the session was created offline, establish the Supabase session first. */
    await establishCloudSession();
    /* Always pull cloud first. This is the critical multi-device bootstrap. */
    await cloudPullAll();
    /* If cloud is empty but this device already has local data, migrate it. */
    const cloudMembers = await cloudStoreCount("members");
    const cloudDeposits = await cloudStoreCount("deposits");
    const localMembers = (await all("members")).length;
    const localDeposits = (await all("deposits")).length;
    if(cloudMembers === 0 && cloudDeposits === 0 && (localMembers > 0 || localDeposits > 0)){
      await mergeLocalToCloud();
      await cloudPullAll();
    }else{
      /* Cloud already exists: merge only newer local records; never overwrite cloud with stale local data. */
      await mergeLocalToCloud();
      await cloudPullAll();
    }
    return true;
  }catch(e){
    console.warn("bootstrapCloudSync", e);
    return false;
  }
}
function migrateLocalToCloud(){ return bootstrapCloudSync(); }
function cloudErrorBn(e){
  const msg = String(e?.message || "");
  if(/row-level security/i.test(msg)) return "Supabase RLS policy সমস্যা। একবার Supabase Dashboard → SQL Editor-এ setup.sql চালান। তারপর ডেটা নিজে থেকেই sync হবে।";
  if(/network|fetch|timeout|failed to fetch/i.test(msg)) return "Internet connection পাওয়া যাচ্ছে না। আপনার ডেটা লোকালি সংরক্ষিত আছে।";
  return "তথ্য সংরক্ষণ করা সম্ভব হয়নি। আপনার ডেটা লোকালি সংরক্ষিত আছে।";
}
/* Turn a Supabase Auth failure into an actionable Bangla explanation. */
function authDiagnosisBn(e){
  const c = String(e?.code || "") + " " + String(e?.message || e || "");
  if(/email_not_confirmed|Email not confirmed/i.test(c))
    return "Supabase-এ 'Confirm email' চালু আছে। ঠিক করতে: Supabase Dashboard → Authentication → Sign In / Providers → Email → 'Confirm email' OFF করে Save করুন। তারপর Dashboard → Authentication → Users থেকে *.dhruvo-sangsad.local সব অ্যাকাউন্ট ডিলিট করে আবার লগইন করুন।";
  if(/already (been )?registered|email.*taken|duplicate|conflict/i.test(c))
    return "এই অ্যাকাউন্টটি আগে অসম্পূর্ণভাবে তৈরি হয়ে ছিল। Supabase Dashboard → Authentication → Users থেকে এই *.dhruvo-sangsad.local অ্যাকাউন্টটি ডিলিট করে আবার লগইন করুন।";
  if(/network|fetch|timeout|failed to fetch/i.test(c))
    return "Internet connection পাওয়া যাচ্ছে না।";
  return "Supabase authentication সমস্যা: " + c;
}
async function syncQueue(){
  if(!cloudReady || !online || !supa || syncBusy) return;
  syncBusy = true;
  try{
    const q = await all("syncQueue");
    for(const x of q.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0))){
      try{
        x.status = "syncing"; await put("syncQueue", x);
        const p = x.payload || {};
        if(x.op === "changePassword"){
          const cp = x.payload || {};
          let email = null;
          if(cp.role === "ADMIN")email = ADMIN_EMAIL;
          else if(cp.role === "MEMBER")email = emailForMember({ memberId: cp.memberId });
          else email = emailForMaker({ username: cp.username });
          const changed = await supaChangePassword(email, cp.oldPassword, cp.newPassword);
          if(!changed) throw new Error("Supabase authentication password update failed");
        }else if(x.op === "createMember" || x.op === "updateMember"){
          if(p && p.localPassword && !p.authUid){
            const uid = await ensureAuthForRecord(p);
            if(uid){ p.authUid = uid; p.updatedAt = Date.now(); suppressCloudQueue = true; try{ await put("members", p); }finally{ suppressCloudQueue = false; } }
          }
          await cloudWrite("members", p);
        }else if(x.op === "createDeposit" || x.op === "updateDeposit"){
          await cloudWrite("deposits", p);
        }else if(x.op === "createActivityLog"){
          await cloudWrite("activityLogs", { ...p, updatedAt: p.updatedAt || Date.now() });
        }else if(x.op === "createNotification" || x.op === "updateNotification"){
          await cloudWrite("notifications", p);
        }else if(x.op === "deleteMember" || x.op === "deleteDeposit"){
          const store = x.op === "deleteMember" ? "members" : "deposits";
          await cloudDelete(store, p.id || p);
        }else if(x.op === "deleteNotification"){
          await cloudDelete("notifications", p.id || p);
        }else if(x.op === "updateSettings"){
          await cloudWrite("settings", p);
        }
        await del("syncQueue", x.id);
      }catch(err){
        x.status = "failed"; x.lastError = String(err?.message || err); x.retryAt = Date.now() + 5000;
        try{ await put("syncQueue", x); }catch(_e){}
        if(!x.errorNotified && typeof showAlertPopup === "function"){
          x.errorNotified = true;
          try{ await put("syncQueue", x); }catch(_e){}
          showAlertPopup("Cloud ডেটা sync করা যায়নি। " + cloudErrorBn(err));
        }
      }
    }
  }finally{ syncBusy = false; }
}
async function cloudPut(store, record){
  await put(store, record);
  await queue(store === "members" ? "updateMember" :
              store === "deposits" ? "updateDeposit" :
              store === "notifications" ? (record.type ? "createNotification" : "updateNotification") :
              store === "activityLogs" ? "createActivityLog" : "updateSettings", record);
  if(cloudReady) syncQueue();
}
async function cloudDeleteWrap(store, recordId){
  await del(store, recordId);
  await queue(store === "members" ? "deleteMember" : "deleteDeposit", { id: recordId });
  if(cloudReady) syncQueue();
}

/* ---------------- Theme: Light / Dark (AMOLED full-black) / Auto ---------------- */
function getSavedTheme(){ try{ const t = localStorage.getItem("dhruvoTheme"); return (t === "light" || t === "dark" || t === "auto") ? t : "auto"; }catch(e){ return "auto"; } }
function applyTheme(){
  const t = getSavedTheme();
  const mq = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)")) || null;
  const dark = t === "dark" || (t === "auto" && mq && mq.matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  try{ document.documentElement.style.colorScheme = dark ? "dark" : "light"; }catch(e){}
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", dark ? "#000000" : "#e9f7ef");
  const btn = document.getElementById("themeToggleBtn");
  if(btn){ btn.textContent = dark ? "☀️" : "🌙"; btn.title = "Theme: " + (dark ? "dark" : "light") + " (tap to change)"; }
}
function setTheme(t){ try{ localStorage.setItem("dhruvoTheme", t); }catch(e){} applyTheme(); }
function cycleTheme(){
  const t = getSavedTheme();
  const next = t === "auto" ? "light" : (t === "light" ? "dark" : "auto");
  setTheme(next);
  if(session) refreshCurrentView();
}
function wireThemeBtn(){ const b = document.getElementById("themeToggleBtn"); if(b) b.onclick = cycleTheme; applyTheme(); }
function themeBtnHtml(){ return `<button id="themeToggleBtn" class="neutral theme-btn" type="button" title="Theme (Light/Dark)" style="position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:10;box-shadow:var(--shadow)">🌙</button>`; }
if(window.matchMedia && typeof window.matchMedia("(prefers-color-scheme: dark)").addEventListener === "function"){
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if(getSavedTheme() === "auto") applyTheme(); });
}

function openDB(){ return new Promise((res, rej) => {
  const r = indexedDB.open(DB_NAME, DB_VER);
  r.onupgradeneeded = e => {
    const d = e.target.result;
    stores.forEach(s => {
      if(!d.objectStoreNames.contains(s)){
        const o = d.createObjectStore(s, { keyPath:"id" });
        if(s === "members"){ o.createIndex("mobile","mobile",{unique:false}); o.createIndex("memberId","memberId",{unique:false}); }
        if(s === "deposits"){ o.createIndex("memberId","memberId",{unique:false}); o.createIndex("date","date",{unique:false}); }
      }
    });
  };
  r.onsuccess = () => { db = r.result; res(db); };
  r.onerror = () => rej(r.error);
}); }
function put(store, v){ return new Promise((res, rej) => {
  const t = db.transaction(store, "readwrite");
  t.objectStore(store).put(v);
  t.oncomplete = async () => {
    try{
      if(!suppressCloudQueue && v && v.id && ["notifications","settings"].includes(store)){
        await queue(store === "notifications" ? (v.type ? "createNotification" : "updateNotification") : "updateSettings", v);
        if(cloudReady) syncQueue();
      }
    }catch(e){ console.warn("cloud queue", e); }
    res(v);
  };
  t.onerror = () => rej(t.error);
}); }
function del(store, k){ return new Promise((res, rej) => {
  const t = db.transaction(store, "readwrite");
  t.objectStore(store).delete(k);
  t.oncomplete = async () => {
    try{
      if(!suppressCloudQueue && ["members","deposits","notifications","settings"].includes(store)){
        await queue(store === "members" ? "deleteMember" : store === "deposits" ? "deleteDeposit" : "deleteNotification", { id:k });
        if(cloudReady) syncQueue();
      }
    }catch(e){ console.warn("cloud delete queue", e); }
    res();
  };
  t.onerror = () => rej(t.error);
}); }
function all(store){ return new Promise((res, rej) => { const r = db.transaction(store).objectStore(store).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function one(store, k){ return new Promise((res, rej) => { const r = db.transaction(store).objectStore(store).get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function queue(op, payload){ await put("syncQueue", { id:id(), createdAt:Date.now(), op, payload, status:"pending" }); }

function fmtInputDate(v){ if(!v) return ""; if(/^\d{2}-\d{2}-\d{4}$/.test(v)) return v; const [y,m,d] = v.split("-"); return `${d}-${m}-${y}`; }
function parseDMY(s){ const [d,m,y] = String(s).split("-").map(Number); return new Date(y, m-1, d); }
function calc(member, deposits){
  let total = deposits.filter(x => x.memberId === member.memberId && x.status === "approved").reduce((a,x) => a + Number(x.amount||0), 0);
  const start = new Date(parseDMY(member.approvedAt || today()));
  const now = new Date();
  let months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth()) + 1;
  if(months < 0) months = 0;
  let required = Math.max(0, months * Number(member.monthlyInstallment||0));
  let due = Math.max(0, required - total), advance = Math.max(0, total - required);
  return { total, due, advance, required };
}

async function resolveEmailForId(uidV){
  if(uidV === "admin") return ADMIN_EMAIL;
  const members = await all("members");
  const mk = members.find(x => x.type === "maker" && x.username === uidV);
  if(mk) return emailForMaker(mk);
  const m = members.find(x => x.mobile === uidV || x.memberId === uidV);
  if(m) return emailForMember(m);
  if(!cloudReady) return null;
  try{
    const { data } = await supa.from("members").select("member_id,mobile,username,type").or(`member_id.eq.${uidV},mobile.eq.${uidV},username.eq.${uidV}`).limit(1);
    if(data && data[0]){ const r = data[0]; return r.type === "maker" ? emailForMaker(r) : emailForMember(r); }
  }catch(e){ console.warn("resolveEmailForId", e); }
  return null;
}

async function login(uid, pw){
  uid = normalizeDigits(uid.trim()); pw = String(pw || "");
  const members = await all("members");
  let m = members.find(x => x.mobile === uid || x.memberId === uid);
  if(uid === "admin"){
    const settings = await all("settings");
    const saved = settings.find(x => x.key === "adminPassword")?.value || "admin";
    /* Admin password is verified locally first (works online AND offline). */
    if(pw !== saved) return showAlertPopup("User ID বা Password সঠিক নয়। অনুগ্রহ করে সঠিক তথ্য দিয়ে পুনরায় চেষ্টা করুন।");
    session = { username:"admin", role:"ADMIN", first:true, password:pw };
    saveSession();
    await log("Login/Logout Activity", "Admin Logged In");
    /* IMPORTANT: render the application before any cloud bootstrap so
       network problems can never block the Top Tab Bar. */
    renderApp();
    if(cloudReady){
      const ok = await supaAdminLogin(pw);
      /* Data sync works over public RLS even if the Auth session can't be made. */
      if(!ok) showAlertPopup(authDiagnosisBn(lastAuthError) + "\n\nতবুও আপনি অ্যাপ ব্যবহার ও ডেটা সিঙ্ক করতে পারবেন। সব ঠিক করতে উপরের ধাপগুলো করুন।");
      startCloudAfterLogin("ADMIN");
    }
    const event = new CustomEvent("loginSuccess");
    window.dispatchEvent(event);
    return;
  }
  let maker = members.find(x => x.type === "maker" && x.username === uid && x.status === "active");
  if(!maker && cloudReady){
    try{
      const { data } = await supa.from("members").select("*").eq("username", uid).limit(1);
      if(data && data[0]){
        const cm = memberCloudToLocal(data[0]);
        maker = cm;
        suppressCloudQueue = true;
        try{ await mergeCloudRow("members", data[0]); }finally{ suppressCloudQueue = false; }
      }
    }catch(e){ console.warn("Maker cloud lookup", e); }
  }
  if(maker && maker.type === "maker" && maker.status === "active"){
    if(maker.localPassword !== pw) return showAlertPopup("User ID বা Password সঠিক নয়।");
    session = { username:maker.username, role:"MAKER", makerId:maker.id, memberRecordId:maker.id, memberRecord:maker, password:pw, authUid:maker.authUid || null };
    saveSession();
    await log("Login/Logout Activity", "Maker Logged In");
    renderApp();
    if(cloudReady){
      const ok = await supaCredentialLogin(emailForMaker(maker), pw, maker);
      if(!ok) showAlertPopup(authDiagnosisBn(lastAuthError) + "\n\nতবুও আপনি অ্যাপ ব্যবহার ও ডেটা সিঙ্ক করতে পারবেন।");
      startCloudAfterLogin("MAKER");
    }
    const event = new CustomEvent("loginSuccess");
    window.dispatchEvent(event);
    return;
  }
  if(cloudReady){
    /* Online is authoritative for Member authentication. */
    const cloudMember = await supaMemberDirectLogin(uid, pw, m);
    if(cloudMember){
      m = cloudMember;
      suppressCloudQueue = true;
      try{ await put("members", m); }finally{ suppressCloudQueue = false; }
      session = { username:m.memberId, displayName:m.nameBn || m.nameEn || m.memberId, role:"MEMBER", memberId:m.memberId, memberRecordId:m.id, memberRecord:m, password:pw, authUid:m.authUid || null };
      saveSession();
      await log("Login/Logout Activity", `Member ${m.memberId} Logged In`);
      renderApp();
      startCloudAfterLogin("MEMBER");
      const event = new CustomEvent("loginSuccess");
      window.dispatchEvent(event);
      return;
    }
  }
  if(m && m.status === "active"){
    if(m.localPassword !== pw) return showAlertPopup("User ID বা Password সঠিক নয়। অনুগ্রহ করে সঠিক তথ্য দিয়ে পুনরায় চেষ্টা করুন।");
    session = { username:m.memberId, displayName:m.nameBn || m.nameEn || m.memberId, role:"MEMBER", memberId:m.memberId, memberRecordId:m.id, memberRecord:m, password:pw, authUid:m.authUid || null };
    saveSession();
    await log("Login/Logout Activity", `Member ${m.memberId} Logged In`);
    renderApp();
    if(cloudReady){
      const ok = await supaCredentialLogin(emailForMember(m), pw, m);
      if(!ok) showAlertPopup(authDiagnosisBn(lastAuthError) + "\n\nতবুও আপনি অ্যাপ ব্যবহার ও ডেটা সিঙ্ক করতে পারবেন।");
      startCloudAfterLogin("MEMBER");
    }
    const event = new CustomEvent("loginSuccess");
    window.dispatchEvent(event);
    return;
  }
  showAlertPopup("User ID বা Password সঠিক নয়। অনুগ্রহ করে সঠিক তথ্য দিয়ে পুনরায় চেষ্টা করুন।");
}

async function activity(){ await settings(); }

/* Forms we must NEVER re-render while the user is typing / selecting.
   Re-rendering (from the 10s reconciler or a Realtime event) destroys the
   user's in-progress input. These views update themselves on submit. */
const FORM_VIEWS = ["deposit"];
async function refreshCurrentView(){
  try{
    if(!session) return;
    if(FORM_VIEWS.includes(currentView)) return; /* keep user input intact */
    const fn = { home:dashboard, members:memberList, profile:profile, deposit:depositForm, history:history, reports:reports, notifications:notifications, activity:activity, admin:adminPanel, dataManage:dataManagement, maker:makerPanel, backup:backup, settings:settings }[currentView];
    if(typeof fn === "function") await fn();
  }catch(e){ console.warn("UI refresh after cloud update", e); }
}

async function startCloudAfterLogin(loginRole){
  try{
    if(!cloudReady || !session) return;
    await bootstrapCloudSync();
    await startRealtime();
    await syncQueue();
    /* Cloud bootstrap may have changed the data shown on the first screen. */
    await refreshCurrentView();
    startReconcileTimer();
  }catch(e){
    console.warn("Cloud startup after login", e);
    updateDbStatus(false);
  }
}

/* Navigation Configuration for Top Tab Bar (unchanged) */
function navTabs(){
  let r = role(session);
  let a = [["home","Dashboard"],["members","Members"],["deposit","Deposit"],["history","History"],["reports","Reports"],["notifications","Notifications"]];
  if(r === "MEMBER"){
    a = [["home","Dashboard"],["profile","My Profile"],["deposit","Deposit"],["history","My History"],["reports","My Statement"],["settings","Settings"]];
  } else if(r === "ADMIN"){

const MEMBER_ALLOWED_ROUTES = ["home","profile","deposit","history","reports","settings"];

  const update = async () => {

    let normal = approved.filter(x => !["উত্তোলন","Withdrawal","withdrawal"].includes(x.type));
    let withdrawals = approved.filter(x => ["উত্তোলন","Withdrawal","withdrawal"].includes(x.type));
    let totalDeposit = normal.reduce((a,x) => a + Number(x.amount||0), 0);
    let totalWithdrawal = withdrawals.reduce((a,x) => a + Number(x.amount||0), 0);
    let last = [...normal].sort((a,b) => (b.submittedAt||0) - (a.submittedAt||0))[0];

    $("#depositMemberInfo").innerHTML = m ? `
    <div class="section-title" style="margin:0 0 8px">Member Account Summary</div>
    <div style="font-weight:700;font-size:16px">${m.nameBn || m.nameEn}</div>
    <div class="muted">Member ID: ${m.memberId} · Mobile: ${m.mobile || "—"}</div>
    <div class="grid" style="margin-top:8px">
      <div><span class="muted">Installment</span><br><b>৳${money(m.monthlyInstallment)}</b></div>
      <div><span class="muted">Total</span><br><b>৳${money(totalDeposit)}</b></div>
      <div><span class="muted">Due</span><br><b>৳${money(c.due)}</b></div>
      <div><span class="muted">Advance</span><br><b>৳${money(c.advance)}</b></div>
      <div><span class="muted">সর্বশেষ জমা</span><br><b>${last?.date || "—"} · ৳${money(last?.amount||0)}</b></div>
      <div><span class="muted">মোট উত্তোলন</span><br><b>৳${money(totalWithdrawal)}</b></div>
    </div>` : "";
  };

  const updatePaymentFields = () => {
    const p = $("#pm").value;
    $("#cashBox").style.display = p === "Cash" ? "block" : "none";
    $("#bankBox").style.display = p === "Bank" ? "block" : "none";
    $("#mobileBox").style.display = p === "Mobile Banking" ? "block" : "none";
  };
  $("#dm").onchange = update; $("#pm").onchange = updatePaymentFields;
  await update(); updatePaymentFields();

  $("#df").onsubmit = async e => {
    e.preventDefault();
    let m = ms.find(x => x.memberId === $("#dm").value);
    if(!m || m.status !== "active") return showAlertPopup("Inactive/Pending Member-এর জন্য জমা বা উত্তোলন করা যাবে না।");

    const paymentMethod = $("#pm").value;
    let paymentDetail = "";
    if(paymentMethod === "Cash"){
      paymentDetail = $("#cashDepositor").value.trim();
      if(!paymentDetail) return showAlertPopup("Cash জমা হলে কার মাধ্যমে জমা দিয়েছে তা লিখুন।");
    }else if(paymentMethod === "Bank"){
      paymentDetail = $("#bankMethod").value;
    }else if(paymentMethod === "Mobile Banking"){
      paymentDetail = $("#mobileMethod").value;
    }

    let type = $("#dt").value;
    if((type === "বিশেষ চাঁদা" || type === "অন্যান্য") && !$("#desc").value.trim()) return showAlertPopup("Description required");

    const amount = Number($("#amt").value || 0);
    if(amount <= 0) return showAlertPopup("জমার অংক সঠিকভাবে দিন");

    const status = role(session) === "MEMBER" ? "pending" : "approved";

    let d = {
      id:id(), memberId:m.memberId, memberName:m.nameBn, date:$("#dd").value || today(),
      type, description:$("#desc").value.trim(), amount,
      paymentMethod, paymentDetail,
      cashDepositor: paymentMethod === "Cash" ? $("#cashDepositor").value.trim() : "",
      bankMethod: paymentMethod === "Bank" ? $("#bankMethod").value : "",
      mobileMethod: paymentMethod === "Mobile Banking" ? $("#mobileMethod").value : "",
      reference: normalizeDigits($("#ref").value.trim()),
      note: $("#note").value.trim(),
      submittedBy: session.username, submittedAt: Date.now(), status
    };

    await put("deposits", d);
    await queue("createDeposit", d);
    await log("গুরুত্বপূর্ণ Account Activity", `Deposit Submission: ${d.memberId} ৳${d.amount} (${d.paymentMethod})`);

    if(status === "pending"){
      await put("notifications", {
        id:id(),
        message:`Pending deposit: ${d.memberId} — ${d.memberName} — ৳${money(d.amount)} — ${d.paymentMethod} (${d.paymentDetail})`,
        createdAt:Date.now(), audience:"staff", type:"transaction-pending", depositId:d.id, memberId:d.memberId
      });
      alert(`জমা সফলভাবে Submit হয়েছে।\nAmount: ৳${money(d.amount)}\nStatus: Pending Approval\nAdmin Approve করার পর টাকা Account Balance-এ যোগ হবে।`);
    }else{
      alert(`Deposit Saved & Approved\nAmount: ৳${money(d.amount)}\nStatus: Approved`);
    }

    e.target.reset(); $("#dd").value = today(); updatePaymentFields(); await update();
  };
}

window.approveDeposit = async (id, ok) => {
  let d = await one("deposits", id);
  if(!d) return;
  d.status = ok ? "approved" : "rejected";
  d.reviewedBy = session.username;
  d.reviewedAt = Date.now();
  await put("deposits", d);
  await queue("updateDeposit", d);
  await log("গুরুত্বপূর্ণ Account Activity", `Deposit ${ok ? 'Approved' : 'Rejected'} for ${d.memberId}`);
  toast(ok ? "Deposit Approved" : "Deposit Rejected");
  history();
};

function reportDateDefaults(){
  const to = isoToday();
  const d = new Date(); d.setDate(1);
  const from = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`;
  return { from, to };
}
function reportDmyToISO(s){
  if(!s) return "";
  const p = String(s).split("-");
  if(p.length !== 3) return s;
  return `${p[2]}-${p[1]}-${p[0]}`;
}
function reportIsWithdrawal(d){ return ["উত্তোলন","Withdrawal","withdrawal"].includes(d.type); }
function reportApproved(ds){ return ds.filter(x => x.status === "approved"); }
function reportMemberCalc(m, ds){
  const approved = reportApproved(ds).filter(x => x.memberId === m.memberId);
  const deposits = approved.filter(x => !reportIsWithdrawal(x)).reduce((a,x) => a + Number(x.amount||0), 0);
  const withdrawal = approved.filter(reportIsWithdrawal).reduce((a,x) => a + Number(x.amount||0), 0);
  const c = calc(m, ds);
  return { deposits, withdrawal, balance:deposits - withdrawal, due:c.due, advance:c.advance, required:c.required };
}

function buildReport(type, title, members, ds, logs, opt){
  /* Member isolation (defense in depth): সদস্য শুধু নিজের Statement গণনা করতে পারবে */
  if(role(session) === "MEMBER" && type !== "member-statement") return null;
  const from = opt.from, to = opt.to, status = opt.status, memberId = opt.memberId;
  const inRange = d => { const x = reportDmyToISO(d.date); return (!from || x >= from) && (!to || x <= to); };
  let rows = [], headers = [], summary = "", filterStatus = (d) => status === "all" || d.status === status;

  if(type === "member-statement"){
    const m = members.find(x => x.memberId === memberId); if(!m) return showAlertPopup("Member নির্বাচন করুন");
    const tx = ds.filter(d => d.memberId === m.memberId && d.status === "approved" && inRange(d)).sort((a,b) => parseDMY(a.date) - parseDMY(b.date));
    let bal = 0, dep = 0, wdr = 0;
    rows = tx.map(d => { let a = Number(d.amount||0), w = reportIsWithdrawal(d); if(w){ wdr += a; bal -= a; }else{ dep += a; bal += a; }
      return [d.date, d.description || d.type || "জমা", d.paymentMethod || "—", w ? "" : money(a), w ? money(a) : "", money(bal)];
    });
    headers = ["তারিখ","বিবরণ","মাধ্যম","জমা","উত্তোলন","ব্যালেন্স"];
    summary = `Member: ${m.nameBn || m.nameEn} · ID: ${m.memberId} · মোট জমা ৳${money(dep)} · মোট উত্তোলন ৳${money(wdr)} · ব্যালেন্স ৳${money(bal)}`;
  }else if(type === "member-balance"){
    headers = ["Member ID","Member Name","Mobile","Installment","Total Deposit","Withdrawal","Balance","Due","Advance","Status"];
    rows = members.map(m => { const c = reportMemberCalc(m, ds); return [m.memberId, m.nameBn || m.nameEn, m.mobile || "—", `৳${money(m.monthlyInstallment)}`, `৳${money(c.deposits)}`, `৳${money(c.withdrawal)}`, `৳${money(c.balance)}`, `৳${money(c.due)}`, `৳${money(c.advance)}`, m.status]; });
    summary = `Members: ${members.length}`;
  }else if(type === "collection-date"){
    const tx = reportApproved(ds).filter(inRange).filter(d => !reportIsWithdrawal(d));
    const map = {}; tx.forEach(d => map[d.date] = (map[d.date]||0) + Number(d.amount||0));
    headers = ["তারিখ","মোট জমা","লেনদেন সংখ্যা"];
    rows = Object.keys(map).sort((a,b) => parseDMY(a) - parseDMY(b)).map(k => [k, `৳${money(map[k])}`, tx.filter(d => d.date === k).length]);
    summary = `মোট আদায় ৳${money(tx.reduce((a,d) => a + Number(d.amount||0), 0))}`;
  }else if(type === "collection-month"){
    const tx = reportApproved(ds).filter(inRange);
    const map = {}; tx.forEach(d => { const k = reportDmyToISO(d.date).slice(0,7); map[k] ??= { dep:0, wdr:0, count:0 }; if(reportIsWithdrawal(d)) map[k].wdr += Number(d.amount||0); else map[k].dep += Number(d.amount||0); map[k].count++; });
    headers = ["মাস","জমা","উত্তোলন","নেট","লেনদেন সংখ্যা"];
    rows = Object.keys(map).sort().map(k => [k, `৳${money(map[k].dep)}`, `৳${money(map[k].wdr)}`, `৳${money(map[k].dep - map[k].wdr)}`, map[k].count]);
  }else if(type === "member-collection"){
    const tx = reportApproved(ds).filter(inRange).filter(d => !reportIsWithdrawal(d));
    const map = {}; tx.forEach(d => { map[d.memberId] ??= { name:d.memberName, amount:0, count:0 }; map[d.memberId].amount += Number(d.amount||0); map[d.memberId].count++; });
    headers = ["Member ID","Member Name","মোট জমা","লেনদেন সংখ্যা"];
    rows = Object.entries(map).sort((a,b) => b[1].amount - a[1].amount).map(([id2,x]) => [id2, x.name, `৳${money(x.amount)}`, x.count]);
  }else if(type === "due-advance"){
    headers = ["Member ID","Member Name","Required","Total Deposit","Due","Advance","Status"];
    rows = members.map(m => { const c = reportMemberCalc(m, ds); return [m.memberId, m.nameBn || m.nameEn, `৳${money(c.required)}`, `৳${money(c.deposits)}`, `৳${money(c.due)}`, `৳${money(c.advance)}`, m.status]; }).filter(r => Number(String(r[4]).replace(/[^\d.-]/g,"")) > 0 || Number(String(r[5]).replace(/[^\d.-]/g,"")) > 0);
  }else if(type === "installment"){
    headers = ["Member ID","Member Name","Installment","Required","Collected","Due","Advance"];
    rows = members.map(m => { const c = reportMemberCalc(m, ds); return [m.memberId, m.nameBn || m.nameEn, `৳${money(m.monthlyInstallment)}`, `৳${money(c.required)}`, `৳${money(c.deposits)}`, `৳${money(c.due)}`, `৳${money(c.advance)}`]; });
  }else if(type === "withdrawal"){
    const tx = ds.filter(d => filterStatus(d) && reportIsWithdrawal(d) && inRange(d)).sort((a,b) => parseDMY(a.date) - parseDMY(b.date));
    headers = ["তারিখ","Member ID","Member Name","বিবরণ","মাধ্যম","পরিমাণ","Status"];
    rows = tx.map(d => [d.date, d.memberId, d.memberName, d.description || d.type, d.paymentMethod || "—", `৳${money(d.amount)}`, d.status]);
  }else if(type === "transaction"){
    const tx = ds.filter(d => filterStatus(d) && inRange(d)).sort((a,b) => parseDMY(a.date) - parseDMY(b.date));
    headers = ["তারিখ","Member ID","Member Name","ধরন","মাধ্যম","জমা/উত্তোলন","পরিমাণ","Status"];
    rows = tx.map(d => [d.date, d.memberId, d.memberName, d.type, d.paymentMethod || "—", reportIsWithdrawal(d) ? "উত্তোলন" : "জমা", `৳${money(d.amount)}`, d.status]);
  }else if(type === "payment-method"){
    const tx = reportApproved(ds).filter(inRange);
    const map = {}; tx.forEach(d => { const k = d.paymentMethod || "Unknown"; map[k] ??= { dep:0, wdr:0, count:0 }; if(reportIsWithdrawal(d)) map[k].wdr += Number(d.amount||0); else map[k].dep += Number(d.amount||0); map[k].count++; });
    headers = ["লেনদেনের মাধ্যম","জমা","উত্তোলন","নেট","লেনদেন সংখ্যা"];
    rows = Object.entries(map).map(([k,x]) => [k, `৳${money(x.dep)}`, `৳${money(x.wdr)}`, `৳${money(x.dep - x.wdr)}`, x.count]);
  }else if(type === "member-register"){
    headers = ["Member ID","Name","Mobile","NID","Installment","Status","Registration Date"];
    rows = members.sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).map(m => [m.memberId, m.nameBn || m.nameEn, m.mobile || "—", m.nid || "—", `৳${money(m.monthlyInstallment)}`, m.status, m.createdAt ? new Date(m.createdAt).toLocaleDateString("en-GB") : "—"]);
  }else if(type === "new-members"){
    const arr = members.filter(m => m.createdAt && new Date(m.createdAt) >= new Date(from + "T00:00:00") && new Date(m.createdAt) <= new Date(to + "T23:59:59"));
    headers = ["Member ID","Name","Mobile","Installment","Status","Registration Date"];
    rows = arr.map(m => [m.memberId, m.nameBn || m.nameEn, m.mobile || "—", `৳${money(m.monthlyInstallment)}`, m.status, new Date(m.createdAt).toLocaleDateString("en-GB")]);
  }else if(type === "inactive-members"){
    const arr = members.filter(m => m.status === "inactive" || m.status === "rejected");
    headers = ["Member ID","Name","Mobile","Status","Updated"];
    rows = arr.map(m => [m.memberId, m.nameBn || m.nameEn, m.mobile || "—", m.status, m.updatedAt ? new Date(m.updatedAt).toLocaleDateString("en-GB") : "—"]);
  }else if(type === "fund-summary"){
    const tx = reportApproved(ds).filter(inRange);
    const dep = tx.filter(d => !reportIsWithdrawal(d)).reduce((a,d) => a + Number(d.amount||0), 0);
    const wdr = tx.filter(reportIsWithdrawal).reduce((a,d) => a + Number(d.amount||0), 0);
    headers = ["বিষয়","পরিমাণ"]; rows = [["মোট জমা",`৳${money(dep)}`],["মোট উত্তোলন",`৳${money(wdr)}`],["নেট তহবিল",`৳${money(dep - wdr)}`],["Approved Transaction",tx.length]];
    summary = `Period: ${from} — ${to}`;
  }else if(type === "pending"){
    const pm = members.filter(m => m.status === "pending");
    const pd = ds.filter(d => d.status === "pending");
    headers = ["ধরন","ID","নাম/বিবরণ","তারিখ","পরিমাণ","Status"];
    rows = [...pm.map(m => ["Member Registration", m.memberId, m.nameBn || m.nameEn, m.createdAt ? new Date(m.createdAt).toLocaleDateString("en-GB") : "—", "—", "pending"]),
            ...pd.map(d => ["Transaction", d.memberId, d.memberName, d.date, `৳${money(d.amount)}`, "pending"])];
  }else return null;

  return { title, from, to, headers, rows, summary: summary || `Period: ${from || "—"} — ${to || "—"}` };
}

function statementRows(m, ds, from, to){
  const dmyToISO = s => { const [d,mo,y] = String(s).split("-"); return `${y}-${mo}-${d}`; };
  return ds.filter(d => d.memberId === m.memberId && d.status === "approved" && dmyToISO(d.date) >= from && dmyToISO(d.date) <= to)
    .sort((a,b) => parseDMY(a.date) - parseDMY(b.date));
}

async function notifications(){
  let n = await all("notifications");
  if(role(session) === "ADMIN"){
    for(const x of n){
      if(!x.type && /^New member registration:/i.test(String(x.message || "")) && x.memberId){
        x.type = "member-registration";
        await put("notifications", x);
      }
    }
  }
  if(role(session) === "MEMBER") n = n.filter(x => x.audience === "member" && x.memberId === session.memberId);

  $("#main").innerHTML = `
  <div class="section-title">Notifications</div>
  <div class="card" id="notificationList"></div>`;

  const paint = () => {
    const rows = n.sort((a,b) => b.createdAt - a.createdAt);
    /* Mark-as-read (client-side tracking, no UI change) */
    if(role(session) === "MEMBER"){
      try{
        const key = "dhruvoRead_" + (session.authUid || session.memberId);
        const saved = JSON.parse(localStorage.getItem(key) || "[]");
        rows.forEach(x => { if(!saved.includes(x.id)) saved.push(x.id); });
        if(saved.length > 200) saved.splice(0, saved.length - 200);
        localStorage.setItem(key, JSON.stringify(saved));
      }catch(e){}
    }
    $("#notificationList").innerHTML = rows.map(x => {
      const isMemberRegistration = x.type === "member-registration" || /^New member registration:/i.test(String(x.message || ""));
      const isPendingTransaction = x.type === "transaction-pending" && x.depositId;
      const clickable = role(session) === "ADMIN" && ((isMemberRegistration && x.memberId) || isPendingTransaction);
      return `<div class="notification-item" data-nid="${x.id}"
       style="padding:10px;border-bottom:1px solid var(--row-border);${clickable ? 'cursor:pointer;background:var(--surface-2)' : ''}">
       <div>${x.message}${clickable ? ' <span class="badge pending">Click to Review</span>' : ''}</div>
       <div class="muted">${new Date(x.createdAt).toLocaleString()}</div>
     </div>`;
    }).join("") || "No notifications";

    document.querySelectorAll(".notification-item").forEach(el => {
      el.onclick = async () => {
        const item = n.find(x => x.id === el.dataset.nid);
        if(item && (item.type === "member-registration" || /^New member registration:/i.test(String(item.message || ""))) && item.memberId) {
          const m = (await all("members")).find(x => x.memberId === item.memberId);
          if(m) showPendingMemberPopup(m);
        } else if(item && item.type === "transaction-pending" && item.depositId) {
          const d = await one("deposits", item.depositId);
          if(d) showPendingDepositPopup(d);
        }
      };
    });
  };
  paint();
}

  const pageSize = 10;

  const renderPage = (page) => {
    currentPage = page;
    const start = (currentPage - 1) * pageSize;
    const end = start + pageSize;
    const paginatedLogs = sortedLogs.slice(start, end);
    const totalPages = Math.ceil(sortedLogs.length / pageSize) || 1;

    containerEl.innerHTML = `
      <div class="card" style="margin-top:16px">
        <div class="section-title">Activity Log</div>
        <div class="notice">এখানে Login/Logout, Password Change এবং অন্যান্য গুরুত্বপূর্ণ Account Activity দেখা যাচ্ছে (সর্বশেষ Activity সবার আগে)।</div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Activity Description</th>
              </tr>
            </thead>
            <tbody>
              ${paginatedLogs.map(x => `
                <tr>
                  <td>${x.date}</td>
                  <td>${x.time}</td>
                  <td><strong>[${x.action}]</strong> ${x.details ? '— ' + x.details : ''} (User: ${x.user})</td>
                </tr>
              `).join("") || `<tr><td colspan="3">কোনো Activity Log পাওয়া যায়নি।</td></tr>`}
            </tbody>
          </table>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
          <button class="neutral" id="actPrevBtn" ${currentPage === 1 ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>Previous</button>
          <span style="font-size:12px;font-weight:700">Page ${currentPage} of ${totalPages}</span>
          <button class="neutral" id="actNextBtn" ${currentPage >= totalPages ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>Next</button>
        </div>
      </div>
    `;

    const prevBtn = document.getElementById("actPrevBtn");
    const nextBtn = document.getElementById("actNextBtn");

    if(prevBtn){
      prevBtn.onclick = () => {
        if(currentPage > 1){
          renderPage(currentPage - 1);
        }
      };
    }

    if(nextBtn){
      nextBtn.onclick = () => {
        if(currentPage < totalPages){
          renderPage(currentPage + 1);
        }
      };
    }
  };

  renderPage(1);
}

function showPendingDepositPopup(d){
  const old = document.getElementById("pendingDepositModal");

  const modal = document.createElement("div");
  modal.id = "pendingDepositModal";
  modal.className = "modal";
  modal.innerHTML = `
  <div class="modal-card" style="max-height:90vh;overflow:auto">
   <div class="section-title">Pending Transaction Approval</div>
   <div class="notice">লেনদেনের সম্পূর্ণ তথ্য যাচাই করে Approve অথবা Reject করুন।</div>

     <div class="field"><label>Description</label><input value="${d.description || "—"}" readonly></div>

   </div>
  </div>`;

  document.body.appendChild(modal);
  $("#popupCloseDeposit").onclick = () => modal.remove();

    const latest = await one("deposits", d.id);
    if(!latest) return showAlertPopup("Transaction পাওয়া যায়নি");
    if(latest.status !== "pending") return showAlertPopup("এই transaction ইতোমধ্যে Review করা হয়েছে।");

    latest.reviewedBy = session.username;

    modal.remove();
    toast(ok ? "Transaction Approved" : "Transaction Rejected");
    adminPanel();
  };

  $("#popupApproveDeposit").onclick = () => review(true);
  $("#popupRejectDeposit").onclick = () => review(false);
}
