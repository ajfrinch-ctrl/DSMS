<script>

/* ============================================================
   FIREBASE CLOUD / OFFLINE-FIRST INTEGRATION LAYER
   Existing IndexedDB remains the primary local cache.
   Firebase is the cloud source/sync target.
   ============================================================ */
const FIREBASE_ROOT="dhruvo";
let fbApp=null, fbAuth=null, fbDb=null, fbSecondary=null, fbSecondaryAuth=null;
let fbReady=false, fbListeners=[], fbSyncBusy=false;

function fbConfigReady(){
  const c=window.DHRUVO_FIREBASE_CONFIG||{};
  return !!(c.apiKey&&c.authDomain&&c.databaseURL&&c.projectId&&c.appId);
}
function fbPath(store,idValue){return `${FIREBASE_ROOT}/${store}/${idValue}`;}
function fbSafe(v){
  if(v===undefined)return null;
  if(Array.isArray(v))return v.map(fbSafe);
  if(v&&typeof v==="object"){
    const o={};
    Object.keys(v).forEach(k=>{
      if(k==="localPassword"||k==="password")return;
      o[k]=fbSafe(v[k]);
    });
    return o;
  }
  return v;
}
function fbRolePath(uid){return `${FIREBASE_ROOT}/users/${uid}`;}
function fbEmailForMember(m){return `${String(m.memberId||m.id).toLowerCase().replace(/[^a-z0-9_-]/g,"") }@auth.dhruvo-sangsad.local`;}
function fbEmailForMaker(m){return `${String(m.username||m.id).toLowerCase().replace(/[^a-z0-9_-]/g,"") }@maker.dhruvo-sangsad.local`;}
const fbAdminEmail="admin@admin.dhruvo-sangsad.local";

async function firebaseInit(){
  if(!fbConfigReady() || !window.firebase)return false;
  try{
    fbApp=window.firebase.apps?.length ? window.firebase.app() : window.firebase.initializeApp(window.DHRUVO_FIREBASE_CONFIG);
    fbAuth=window.firebase.auth();
    fbDb=window.firebase.database();
    try{if(window.firebase.analytics)window.firebase.analytics();}catch(_e){}
    fbSecondary=window.firebase.apps.find(a=>a.name==="DhruvoSecondary") ||
      window.firebase.initializeApp(window.DHRUVO_FIREBASE_CONFIG,"DhruvoSecondary");
    fbSecondaryAuth=fbSecondary.auth();

    fbAuth.onAuthStateChanged(async user=>{
      if(user) await fbEnsureUserRole(user);
      updateFirebaseStatus(true);
    });
    fbDb.ref(".info/connected").on("value",snap=>{
      const connected=snap.val()===true;
      fbReady=connected;
      updateFirebaseStatus(connected);
      if(connected) syncQueue();
    });
    return true;
  }catch(e){
    console.error("Firebase init",e);
    fbReady=false; updateFirebaseStatus(false);
    return false;
  }
}

function updateFirebaseStatus(connected){
  const el=document.getElementById("firebaseStatus");
  if(el){
    el.textContent=connected?"● Firebase Online":"● Offline / Local";
    el.style.color=connected?"#2d8a57":"#d88a35";
  }
}
function addFirebaseStatusToTopbar(){
  const tb=document.querySelector(".topbar .userbox");
  if(!tb)return;
  if(!document.getElementById("firebaseStatus")){
    const s=document.createElement("span");
    s.id="firebaseStatus";
    s.style.cssText="font-size:11px;font-weight:700;margin-right:4px";
    s.textContent=fbReady?"● Firebase Online":"● Offline / Local";
    tb.insertBefore(s,tb.firstChild);
  }
}

async function fbEnsureUserRole(user){
  if(!fbDb||!user)return;
  try{
    const snap=await fbDb.ref(fbRolePath(user.uid)).once("value");
    if(!snap.exists()){
      // Existing member/maker/admin records can establish a role mapping.
      const ms=await all("members");
      const m=ms.find(x=>x.authUid===user.uid);
      if(m){
        await fbDb.ref(fbRolePath(user.uid)).set({
          uid:user.uid,role:m.type==="maker"?"MAKER":"MEMBER",
          memberId:m.memberId||null,username:m.username||m.memberId||null,
          updatedAt:Date.now()
        });
      }
    }
  }catch(e){console.warn("role mapping",e)}
}

async function fbWrite(store,record){
  if(!fbDb||!fbReady||!record?.id)return false;
  // Never upload local admin password or any plaintext password to Realtime Database.
  if(store==="settings" && record.key==="adminPassword")return false;
  const clean=fbSafe({...record,updatedAt:record.updatedAt||Date.now()});
  await fbDb.ref(fbPath(store,record.id)).set(clean);
  return true;
}
async function fbDelete(store,recordId){
  if(!fbDb||!fbReady)return false;
  await fbDb.ref(fbPath(store,recordId)).remove();
  return true;
}

async function fbCreateAuthForRecord(record){
  if(!fbSecondaryAuth||!record?.localPassword||record.authUid)return record?.authUid||null;
  const email=record.type==="maker"?fbEmailForMaker(record):fbEmailForMember(record);
  try{
    const cred=await fbSecondaryAuth.createUserWithEmailAndPassword(email,String(record.localPassword));
    record.authUid=cred.user.uid;
    await fbDb.ref(`${FIREBASE_ROOT}/authLookup/${record.memberId||record.username}`).set({
      uid:record.authUid,memberId:record.memberId||null,username:record.username||null,
      mobile:record.mobile||null,email
    });
    if(record.mobile)await fbDb.ref(`${FIREBASE_ROOT}/authLookup/mobile_${record.mobile}`).set({
      uid:record.authUid,memberId:record.memberId||null,email
    });
    await fbSecondaryAuth.signOut();
    return record.authUid;
  }catch(e){
    // Account may already exist. Sign in to recover its UID.
    if(e.code==="auth/email-already-in-use" || e.code==="auth/credential-already-in-use"){
      try{
        const cred=await fbSecondaryAuth.signInWithEmailAndPassword(email,String(record.localPassword));
        record.authUid=cred.user.uid;
        await fbDb.ref(`${FIREBASE_ROOT}/authLookup/${record.memberId||record.username}`).set({
          uid:record.authUid,memberId:record.memberId||null,username:record.username||null,
          mobile:record.mobile||null,email
        });
        if(record.mobile)await fbDb.ref(`${FIREBASE_ROOT}/authLookup/mobile_${record.mobile}`).set({
          uid:record.authUid,memberId:record.memberId||null,email
        });
        await fbSecondaryAuth.signOut();
        return record.authUid;
      }catch(err){console.warn("auth recovery",err)}
    }else console.warn("auth create",e);
  }
  return null;
}

async function fbCreateAdminBootstrap(){
  if(!fbSecondaryAuth||!fbDb)return null;
  try{
    const existing=await fbDb.ref(`${FIREBASE_ROOT}/users/admin`).once("value");
    if(existing.exists()&&existing.val().uid)return existing.val().uid;
    const cred=await fbSecondaryAuth.createUserWithEmailAndPassword(fbAdminEmail,"admin");
    await fbSecondaryAuth.signOut();
    return cred.user.uid;
  }catch(e){
    if(e.code==="auth/email-already-in-use"){
      try{
        const c=await fbSecondaryAuth.signInWithEmailAndPassword(fbAdminEmail,"admin");
        await fbSecondaryAuth.signOut();
        return c.user.uid;
      }catch(err){console.warn("admin bootstrap auth",err)}
    }else console.warn("admin bootstrap",e);
  }
  return null;
}

async function fbChangePasswordForSession(s,oldPw,newPw){
  if(!fbSecondaryAuth||!fbReady)return false;
  let email=s.role==="ADMIN"?fbAdminEmail:(s.role==="MEMBER"?fbEmailForMember(s.memberRecord):fbEmailForMaker(s.memberRecord));
  try{
    const cred=await fbSecondaryAuth.signInWithEmailAndPassword(email,String(oldPw));
    await cred.user.updatePassword(String(newPw));
    await fbSecondaryAuth.signOut();
    return true;
  }catch(e){console.warn("Firebase password change",e);try{await fbSecondaryAuth.signOut()}catch(_){};return false}
}

async function fbLoginForSession(s){
  if(!fbAuth||!fbReady)return false;
  let email=null;
  if(s.role==="ADMIN")email=fbAdminEmail;
  else if(s.role==="MEMBER")email=fbEmailForMember(s.memberRecord);
  else if(s.role==="MAKER")email=fbEmailForMaker(s.memberRecord);
  if(!email)return false;
  try{
    if(s.role!=="ADMIN" && s.memberRecord && !s.memberRecord.authUid){
      const uid=await fbCreateAuthForRecord(s.memberRecord);
      if(uid){
        s.memberRecord.authUid=uid;
        await put("members",s.memberRecord);
        await fbWrite("members",s.memberRecord);
      }
    }
    const cred=await fbAuth.signInWithEmailAndPassword(email,s.password);
    s.authUid=cred.user.uid;
    const roleRef=fbDb.ref(fbRolePath(cred.user.uid));
    const roleSnap=await roleRef.once("value");
    if(!roleSnap.exists()){
      await roleRef.set({
        uid:cred.user.uid,role:s.role,
        memberId:s.memberId||null,username:s.username||null,
        updatedAt:Date.now()
      });
    }
    if(s.role==="ADMIN")await fbDb.ref(`${FIREBASE_ROOT}/meta/adminUid`).set(cred.user.uid);
    return true;
  }catch(e){
    if(e.code==="auth/user-not-found" && s.role==="ADMIN"){
      const uid=await fbCreateAdminBootstrap();
      if(uid){
        const cred=await fbAuth.signInWithEmailAndPassword(email,s.password);
        s.authUid=cred.user.uid; return true;
      }
    }
    console.warn("Firebase login",e);
    return false;
  }
}

async function fbPullStore(store){
  if(!fbDb||!fbReady)return;
  let ref=fbDb.ref(`${FIREBASE_ROOT}/${store}`);
  if(role(session)==="MEMBER"){
    if(store==="members") ref=fbDb.ref(`${FIREBASE_ROOT}/members/${session.memberRecordId}`);
    else if(store==="deposits") ref=fbDb.ref(`${FIREBASE_ROOT}/deposits`).orderByChild("memberId").equalTo(session.memberId);
    else if(store==="notifications") ref=fbDb.ref(`${FIREBASE_ROOT}/notifications`).orderByChild("memberId").equalTo(session.memberId);
    else if(store==="activityLogs") ref=fbDb.ref(`${FIREBASE_ROOT}/activityLogs`).orderByChild("user").equalTo(session.memberId);
    else return;
  }
  const snap=await ref.once("value");
  const data=snap.val();
  if(!data)return;
  const rows=[];
  if(store==="members"&&session.role==="MEMBER"&&data.id)rows.push(data);
  else Object.keys(data).forEach(k=>{if(data[k]&&typeof data[k]==="object")rows.push({...data[k],id:data[k].id||k})});
  for(const row of rows){
    const local=await one(store,row.id);
    if(!local || Number(row.updatedAt||0)>=Number(local.updatedAt||0)){suppressCloudQueue=true;try{await put(store,row)}finally{suppressCloudQueue=false}}
  }
}

async function fbStartRealtime(){
  if(!fbDb||!fbReady)return;
  fbStopRealtime();
  const storesToWatch=role(session)==="MEMBER"
    ? ["members","deposits","notifications","activityLogs"]
    : ["members","deposits","notifications","activityLogs","settings"];
  for(const store of storesToWatch){
    let ref=fbDb.ref(`${FIREBASE_ROOT}/${store}`);
    if(role(session)==="MEMBER"){
      if(store==="members")ref=fbDb.ref(`${FIREBASE_ROOT}/members/${session.memberRecordId}`);
      else if(store==="deposits")ref=fbDb.ref(`${FIREBASE_ROOT}/deposits`).orderByChild("memberId").equalTo(session.memberId);
      else if(store==="notifications")ref=fbDb.ref(`${FIREBASE_ROOT}/notifications`).orderByChild("memberId").equalTo(session.memberId);
      else if(store==="activityLogs")ref=fbDb.ref(`${FIREBASE_ROOT}/activityLogs`).orderByChild("user").equalTo(session.memberId);
      else continue;
    }
    const handler=async snap=>{
      const data=snap.val();
      if(!data)return;
      const rows=[];
      if(store==="members"&&role(session)==="MEMBER"&&data.id)rows.push(data);
      else Object.keys(data).forEach(k=>{if(data[k]&&typeof data[k]==="object")rows.push({...data[k],id:data[k].id||k})});
      for(const row of rows){
        const local=await one(store,row.id);
        if(!local||Number(row.updatedAt||0)>=Number(local.updatedAt||0)){suppressCloudQueue=true;try{await put(store,row)}finally{suppressCloudQueue=false}}
      }
      try{
        if(location.hash)route(location.hash.slice(1));
      }catch(e){}
    };
    ref.on("value",handler);
    fbListeners.push({ref,handler});
  }
}

function fbStopRealtime(){fbListeners.forEach(x=>{try{x.ref.off("value",x.handler)}catch(e){}});fbListeners=[]}

async function migrateLocalToFirebase(){
  if(!fbReady)return;
  const marker=await one("settings","firebaseMigrationComplete");
  if(marker?.value===true){await syncQueue();return;}
  for(const store of ["members","deposits","notifications","activityLogs","settings"]){
    const rows=await all(store);
    for(const row of rows){
      if(store==="members"&&row.localPassword&&!row.authUid){
        const uid=await fbCreateAuthForRecord(row);
        if(uid){row.authUid=uid;row.updatedAt=Date.now();suppressCloudQueue=true;try{await put("members",row)}finally{suppressCloudQueue=false}}
      }
      try{await fbWrite(store,row)}catch(e){console.warn("migration",store,row.id,e)}
    }
  }
  suppressCloudQueue=true;try{await put("settings",{id:"firebaseMigrationComplete",key:"firebaseMigrationComplete",value:true,updatedAt:Date.now()})}finally{suppressCloudQueue=false}
}

async function syncQueue(){
  if(!fbReady||!online||fbSyncBusy)return;
  fbSyncBusy=true;
  try{
    const q=await all("syncQueue");
    for(const x of q.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))){
      try{
        x.status="syncing";await put("syncQueue",x);
        const p=x.payload||{};
        if(x.op==="changePassword"){
          const cp=x.payload||{};
          let rec=null;
          if(cp.role==="ADMIN")rec={role:"ADMIN"};
          else if(cp.role==="MEMBER")rec={role:"MEMBER",memberRecord:{memberId:cp.memberId}};
          else rec={role:"MAKER",memberRecord:{username:cp.username}};
          const changed=await fbChangePasswordForSession(rec,cp.oldPassword,cp.newPassword);
          if(!changed)throw new Error("Firebase Authentication password update failed");
        }else if(x.op==="createMember"||x.op==="updateMember"){
          const uid=await fbCreateAuthForRecord(p);
          if(uid){p.authUid=uid;suppressCloudQueue=true;try{await put("members",p)}finally{suppressCloudQueue=false}}
          await fbWrite("members",p);
        }else if(x.op==="createDeposit"||x.op==="updateDeposit")await fbWrite("deposits",p);
        else if(x.op==="createActivityLog")await fbWrite("activityLogs",{...p,id:p.id||x.id,updatedAt:Date.now()});
        else if(x.op==="createNotification")await fbWrite("notifications",p);
        else if(x.op==="updateNotification")await fbWrite("notifications",p);
        else if(x.op==="deleteMember"||x.op==="deleteDeposit"){
          const store=x.op==="deleteMember"?"members":"deposits";
          await fbDelete(store,p.id||p);
        }else if(x.op==="deleteNotification")await fbDelete("notifications",p.id||p);
        else if(x.op==="updateSettings")await fbWrite("settings",p);
        await del("syncQueue",x.id);
      }catch(err){
        x.status="failed";x.lastError=String(err?.message||err);x.retryAt=Date.now()+5000;await put("syncQueue",x);
        if(!x.errorNotified && typeof showAlertPopup==="function"){
          x.errorNotified=true;await put("syncQueue",x);
          showAlertPopup("Firebase connection failed. Your data is saved locally and will sync automatically when connection is restored.");
        }
      }
    }
  }finally{fbSyncBusy=false}
}

async function cloudPut(store,record){
  await put(store,record);
  await queue(store==="members"?(record.authUid?"updateMember":"createMember"):
              store==="deposits"?(record.authUid?"updateDeposit":"createDeposit"):
              store==="notifications"?(record.type?"createNotification":"updateNotification"):
              store==="activityLogs"?"createActivityLog":"updateSettings",record);
  if(fbReady)syncQueue();
}
async function cloudDelete(store,recordId){
  await del(store,recordId);
  await queue(store==="members"?"deleteMember":"deleteDeposit",{id:recordId});
  if(fbReady)syncQueue();
}

/* Dhruvo Sangsad — application core. No framework. */
const DB_NAME="DhruvoSangsadDB", DB_VER=1;
const stores=["members","deposits","notifications","activityLogs","settings","syncQueue"];
let db, session=null, online=navigator.onLine;
let suppressCloudQueue=false;
function saveSession(){try{const safe=session?{...session,password:undefined,memberRecord:undefined}:session;sessionStorage.setItem("dhruvoSession",JSON.stringify(safe));}catch(e){}}
function loadSession(){try{const x=sessionStorage.getItem("dhruvoSession");return x?JSON.parse(x):null;}catch(e){return null;}}

const $=s=>document.querySelector(s);
const today=()=>{const d=new Date();return String(d.getDate()).padStart(2,"0")+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+d.getFullYear()};
const isoToday=()=>new Date().toISOString().slice(0,10);
const money=n=>Number(n||0).toLocaleString("en-BD",{minimumFractionDigits:2,maximumFractionDigits:2});
const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2);
const norm=s=>String(s||"").trim().toLowerCase();
const role=(u)=>u?.role||"";

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=e=>{const d=e.target.result;stores.forEach(s=>{if(!d.objectStoreNames.contains(s)){const o=d.createObjectStore(s,{keyPath:"id"});if(s==="members"){o.createIndex("mobile","mobile",{unique:false});o.createIndex("memberId","memberId",{unique:false})}if(s==="deposits"){o.createIndex("memberId","memberId",{unique:false});o.createIndex("date","date",{unique:false})}}});};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}
function put(store,v){return new Promise((res,rej)=>{const t=db.transaction(store,"readwrite");t.objectStore(store).put(v);t.oncomplete=async()=>{try{if(!suppressCloudQueue&&v&&v.id&&["notifications","settings"].includes(store)){await queue(store==="notifications"?(v.type?"createNotification":"updateNotification"):"updateSettings",v);if(fbReady)syncQueue();}}catch(e){console.warn("cloud queue",e)}res(v)};t.onerror=()=>rej(t.error)})}
function del(store,k){return new Promise((res,rej)=>{const t=db.transaction(store,"readwrite");t.objectStore(store).delete(k);t.oncomplete=async()=>{try{if(!suppressCloudQueue&&["members","deposits","notifications","settings"].includes(store)){await queue(store==="members"?"deleteMember":store==="deposits"?"deleteDeposit":"deleteNotification",{id:k});if(fbReady)syncQueue();}}catch(e){console.warn("cloud delete queue",e)}res()};t.onerror=()=>rej(t.error)})}
function all(store){return new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function one(store,k){return new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function queue(op,payload){await put("syncQueue",{id:id(),createdAt:Date.now(),op,payload,status:"pending"});}

function normalizeDigits(v){
 return String(v||"")
   .replace(/[০-৯]/g,c=>String("০১২৩৪৫৬৭৮৯".indexOf(c)))
   .replace(/[٠-٩]/g,c=>String("٠١٢٣٤٥٦٧٨٩".indexOf(c)));
}

function showAlertPopup(message, isSuccess = false, onOkCallback = null){
 const old=document.getElementById("customAlertModal"); if(old)old.remove();
 const modal=document.createElement("div");
 modal.id="customAlertModal";
 modal.className="alert-modal";
 modal.innerHTML=`
 <div class="alert-card">
   <h3 style="${isSuccess ? 'color:#5eaa7b;' : ''}">${isSuccess ? 'সফল হয়েছে' : 'সতর্কতা / ভুল'}</h3>
   <p>${message}</p>
   <button class="primary" id="closeAlertBtn" style="width:100%">ঠিক আছে</button>
 </div>`;
 document.body.appendChild(modal);
 const closeBtn = document.getElementById("closeAlertBtn");
 closeBtn.onclick=()=>{
   modal.remove();
   if(onOkCallback) onOkCallback();
 };
 modal.onclick=(e)=>{if(e.target===modal){modal.remove();if(onOkCallback) onOkCallback();}};
}

function fmtInputDate(v){if(!v)return ""; if(/^\d{2}-\d{2}-\d{4}$/.test(v))return v; const [y,m,d]=v.split("-"); return `${d}-${m}-${y}`}
function parseDMY(s){const [d,m,y]=String(s).split("-").map(Number);return new Date(y,m-1,d)}
function calc(member, deposits){let total=deposits.filter(x=>x.memberId===member.memberId&&x.status==="approved").reduce((a,x)=>a+Number(x.amount||0),0);const start=new Date(parseDMY(member.approvedAt||today()));const now=new Date();let months=(now.getFullYear()-start.getFullYear())*12+(now.getMonth()-start.getMonth())+1;if(months<0)months=0;let required=Math.max(0,months*Number(member.monthlyInstallment||0));let due=Math.max(0,required-total), advance=Math.max(0,total-required);return {total,due,advance,required}}

async function login(uid,pw){
 uid=normalizeDigits(uid.trim()); pw=String(pw||"");
 const members=await all("members");
 let m=members.find(x=>x.mobile===uid || x.memberId===uid);
 if(uid==="admin"){
   const settings=await all("settings");
   const saved=settings.find(x=>x.key==="adminPassword")?.value||"admin";
   if(!fbReady && pw!==saved)return showAlertPopup("User ID বা Password সঠিক নয়। অনুগ্রহ করে সঠিক তথ্য দিয়ে পুনরায় চেষ্টা করুন।");
   session={username:"admin",role:"ADMIN",first:true,password:pw};
   if(fbReady){
     await syncQueue();
     const ok=await fbLoginForSession(session);
     if(!ok)return showAlertPopup("Firebase Authentication-এ Admin Login সফল হয়নি। Password সঠিক কিনা এবং Firebase Auth চালু আছে কিনা পরীক্ষা করুন।");
   }
   saveSession(); if(fbReady&&session.role!=="MEMBER")await migrateLocalToFirebase(); await log("Login/Logout Activity","Admin Logged In"); renderApp(); return;
 }
 let maker=members.find(x=>x.type==="maker"&&x.username===uid&&x.status==="active");
 if(!maker&&fbReady){
   try{
     const key=uid;
     const snap=await fbDb.ref(`${FIREBASE_ROOT}/authLookup/${key}`).once("value");
     const lk=snap.val();
     if(lk?.uid&&lk.username){
       const cloudSnap=await fbDb.ref(`${FIREBASE_ROOT}/members/${lk.memberId||key}`).once("value");
       const cm=cloudSnap.val();
       if(cm){maker=cm;suppressCloudQueue=true;try{await put("members",cm)}finally{suppressCloudQueue=false}}
     }
   }catch(e){}
 }
 if(maker&&maker.type==="maker"&&maker.status==="active"){
   if(!fbReady&&maker.localPassword!==pw)return showAlertPopup("User ID বা Password সঠিক নয়।");
   session={username:maker.username,role:"MAKER",makerId:maker.id,memberRecordId:maker.id,memberRecord:maker,password:pw};
   if(fbReady){
     const ok=await fbLoginForSession(session);
     if(!ok)return showAlertPopup("Firebase Authentication-এ Maker Login সফল হয়নি।");
   }
   saveSession();if(fbReady)await migrateLocalToFirebase();await log("Login/Logout Activity","Maker Logged In");renderApp();return;
 }
 if(!m&&fbReady){
   try{
     const key=/^\d+$/.test(uid)?`mobile_${uid}`:uid;
     const snap=await fbDb.ref(`${FIREBASE_ROOT}/authLookup/${key}`).once("value");
     const lk=snap.val();
     if(lk?.memberId){
       const cloudSnap=await fbDb.ref(`${FIREBASE_ROOT}/members/${lk.memberId}`).once("value");
       const cm=cloudSnap.val();
       if(cm){m=cm;suppressCloudQueue=true;try{await put("members",cm)}finally{suppressCloudQueue=false}}
     }
   }catch(e){}
 }
 if(m&&m.status==="active"){
   if(!fbReady&&m.localPassword!==pw)return showAlertPopup("User ID বা Password সঠিক নয়।");
   session={username:m.memberId,displayName:m.nameBn||m.nameEn||m.memberId,role:"MEMBER",memberId:m.memberId,memberRecordId:m.id,memberRecord:m,password:pw};
   if(fbReady){
     const ok=await fbLoginForSession(session);
     if(!ok)return showAlertPopup("Firebase Authentication-এ Member Login সফল হয়নি।");
   }
   saveSession();await log("Login/Logout Activity",`Member ${m.memberId} Logged In`);renderApp();return;
 }
 showAlertPopup("User ID বা Password সঠিক নয়। অনুগ্রহ করে সঠিক তথ্য দিয়ে পুনরায় চেষ্টা করুন।");
}

 const update=async()=>{
   let m=ms.find(x=>x.memberId===$("#dm").value);
   let ds=await all("deposits");
   let c=m?calc(m,ds):{total:0,due:0,advance:0};
   let approved=ds.filter(x=>x.memberId===m?.memberId&&x.status==="approved");
   let normal=approved.filter(x=>!["উত্তোলন","Withdrawal","withdrawal"].includes(x.type));
   let withdrawals=approved.filter(x=>["উত্তোলন","Withdrawal","withdrawal"].includes(x.type));
   let totalDeposit=normal.reduce((a,x)=>a+Number(x.amount||0),0);
   let totalWithdrawal=withdrawals.reduce((a,x)=>a+Number(x.amount||0),0);
   let last=[...normal].sort((a,b)=>(b.submittedAt||0)-(a.submittedAt||0))[0];

   $("#depositMemberInfo").innerHTML=m?`

   const paymentMethod=$("#pm").value;
   let paymentDetail="";
   if(paymentMethod==="Cash"){
     paymentDetail=$("#cashDepositor").value.trim();

   const status=role(session)==="MEMBER"?"pending":"approved";

   let d={
     id:id(),memberId:m.memberId,memberName:m.nameBn,date:$("#dd").value||today(),
     type,description:$("#desc").value.trim(),amount,
     paymentMethod,paymentDetail,
     cashDepositor:paymentMethod==="Cash"?$("#cashDepositor").value.trim():"",

   await put("deposits",d);

       message:`Pending deposit: ${d.memberId} — ${d.memberName} — ৳${money(d.amount)} — ${d.paymentMethod} (${d.paymentDetail})`,

   }else{
     alert(`Deposit Saved & Approved\nAmount: ৳${money(d.amount)}\nStatus: Approved`);
   }

   e.target.reset();$("#dd").value=today();updatePaymentFields();await update();
 };

function reportDateDefaults(){
 const to=isoToday();
 const d=new Date(); d.setDate(1);
 const from=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`;
 return {from,to};
}
function reportDmyToISO(s){
 if(!s)return "";
 const p=String(s).split("-");
 if(p.length!==3)return s;
 return `${p[2]}-${p[1]}-${p[0]}`;
}
function reportIsWithdrawal(d){return ["উত্তোলন","Withdrawal","withdrawal"].includes(d.type)}
function reportApproved(ds){return ds.filter(x=>x.status==="approved")}
function reportMemberCalc(m,ds){
 const approved=reportApproved(ds).filter(x=>x.memberId===m.memberId);
 const deposits=approved.filter(x=>!reportIsWithdrawal(x)).reduce((a,x)=>a+Number(x.amount||0),0);
 const withdrawal=approved.filter(reportIsWithdrawal).reduce((a,x)=>a+Number(x.amount||0),0);
 const c=calc(m,ds);
 return {deposits,withdrawal,balance:deposits-withdrawal,due:c.due,advance:c.advance,required:c.required};
}

function buildReport(type,title,members,ds,logs,opt){
 const from=opt.from,to=opt.to,status=opt.status,memberId=opt.memberId;
 const inRange=d=>{const x=reportDmyToISO(d.date);return (!from||x>=from)&&(!to||x<=to)};
 let rows=[],headers=[],summary="",filterStatus=(d)=>status==="all"||d.status===status;

 if(type==="member-statement"){
   const m=members.find(x=>x.memberId===memberId); if(!m)return showAlertPopup("Member নির্বাচন করুন");
   const tx=ds.filter(d=>d.memberId===m.memberId&&d.status==="approved"&&inRange(d)).sort((a,b)=>parseDMY(a.date)-parseDMY(b.date));
   let bal=0,dep=0,wdr=0;
   rows=tx.map(d=>{let a=Number(d.amount||0),w=reportIsWithdrawal(d);if(w){wdr+=a;bal-=a}else{dep+=a;bal+=a}
     return [d.date,d.description||d.type||"জমা",d.paymentMethod||"—",w?"":money(a),w?money(a):"",money(bal)];
   });
   headers=["তারিখ","বিবরণ","মাধ্যম","জমা","উত্তোলন","ব্যালেন্স"];
   summary=`Member: ${m.nameBn||m.nameEn} · ID: ${m.memberId} · মোট জমা ৳${money(dep)} · মোট উত্তোলন ৳${money(wdr)} · ব্যালেন্স ৳${money(bal)}`;
 }else if(type==="member-balance"){
   headers=["Member ID","Member Name","Mobile","Installment","Total Deposit","Withdrawal","Balance","Due","Advance","Status"];
   rows=members.map(m=>{const c=reportMemberCalc(m,ds);return [m.memberId,m.nameBn||m.nameEn,m.mobile||"—",`৳${money(m.monthlyInstallment)}`,`৳${money(c.deposits)}`,`৳${money(c.withdrawal)}`,`৳${money(c.balance)}`,`৳${money(c.due)}`,`৳${money(c.advance)}`,m.status]});
   summary=`Members: ${members.length}`;
 }else if(type==="collection-date"){
   const tx=reportApproved(ds).filter(inRange).filter(d=>!reportIsWithdrawal(d));
   const map={};tx.forEach(d=>map[d.date]=(map[d.date]||0)+Number(d.amount||0));
   headers=["তারিখ","মোট জমা","লেনদেন সংখ্যা"];
   rows=Object.keys(map).sort((a,b)=>parseDMY(a)-parseDMY(b)).map(k=>[k,`৳${money(map[k])}`,tx.filter(d=>d.date===k).length]);
   summary=`মোট আদায় ৳${money(tx.reduce((a,d)=>a+Number(d.amount||0),0))}`;
 }else if(type==="collection-month"){
   const tx=reportApproved(ds).filter(inRange);
   const map={};tx.forEach(d=>{const k=reportDmyToISO(d.date).slice(0,7);map[k]??={dep:0,wdr:0,count:0};if(reportIsWithdrawal(d))map[k].wdr+=Number(d.amount||0);else map[k].dep+=Number(d.amount||0);map[k].count++});
   headers=["মাস","জমা","উত্তোলন","নেট","লেনদেন সংখ্যা"];
   rows=Object.keys(map).sort().map(k=>[k,`৳${money(map[k].dep)}`,`৳${money(map[k].wdr)}`,`৳${money(map[k].dep-map[k].wdr)}`,map[k].count]);
 }else if(type==="member-collection"){
   const tx=reportApproved(ds).filter(inRange).filter(d=>!reportIsWithdrawal(d));
   const map={};tx.forEach(d=>{map[d.memberId]??={name:d.memberName,amount:0,count:0};map[d.memberId].amount+=Number(d.amount||0);map[d.memberId].count++});
   headers=["Member ID","Member Name","মোট জমা","লেনদেন সংখ্যা"];
   rows=Object.entries(map).sort((a,b)=>b[1].amount-a[1].amount).map(([id,x])=>[id,x.name,`৳${money(x.amount)}`,x.count]);
 }else if(type==="due-advance"){
   headers=["Member ID","Member Name","Required","Total Deposit","Due","Advance","Status"];
   rows=members.map(m=>{const c=reportMemberCalc(m,ds);return [m.memberId,m.nameBn||m.nameEn,`৳${money(c.required)}`,`৳${money(c.deposits)}`,`৳${money(c.due)}`,`৳${money(c.advance)}`,m.status]}).filter(r=>Number(String(r[4]).replace(/[^\d.-]/g,""))>0||Number(String(r[5]).replace(/[^\d.-]/g,""))>0);
 }else if(type==="installment"){
   headers=["Member ID","Member Name","Installment","Required","Collected","Due","Advance"];
   rows=members.map(m=>{const c=reportMemberCalc(m,ds);return [m.memberId,m.nameBn||m.nameEn,`৳${money(m.monthlyInstallment)}`,`৳${money(c.required)}`,`৳${money(c.deposits)}`,`৳${money(c.due)}`,`৳${money(c.advance)}`]});
 }else if(type==="withdrawal"){
   const tx=ds.filter(d=>filterStatus(d)&&reportIsWithdrawal(d)&&inRange(d)).sort((a,b)=>parseDMY(a.date)-parseDMY(b.date));
   headers=["তারিখ","Member ID","Member Name","বিবরণ","মাধ্যম","পরিমাণ","Status"];
   rows=tx.map(d=>[d.date,d.memberId,d.memberName,d.description||d.type,d.paymentMethod||"—",`৳${money(d.amount)}`,d.status]);
 }else if(type==="transaction"){
   const tx=ds.filter(d=>filterStatus(d)&&inRange(d)).sort((a,b)=>parseDMY(a.date)-parseDMY(b.date));
   headers=["তারিখ","Member ID","Member Name","ধরন","মাধ্যম","জমা/উত্তোলন","পরিমাণ","Status"];
   rows=tx.map(d=>[d.date,d.memberId,d.memberName,d.type,d.paymentMethod||"—",reportIsWithdrawal(d)?"উত্তোলন":"জমা",`৳${money(d.amount)}`,d.status]);
 }else if(type==="payment-method"){
   const tx=reportApproved(ds).filter(inRange);
   const map={};tx.forEach(d=>{const k=d.paymentMethod||"Unknown";map[k]??={dep:0,wdr:0,count:0};if(reportIsWithdrawal(d))map[k].wdr+=Number(d.amount||0);else map[k].dep+=Number(d.amount||0);map[k].count++});
   headers=["লেনদেনের মাধ্যম","জমা","উত্তোলন","নেট","লেনদেন সংখ্যা"];
   rows=Object.entries(map).map(([k,x])=>[k,`৳${money(x.dep)}`,`৳${money(x.wdr)}`,`৳${money(x.dep-x.wdr)}`,x.count]);
 }else if(type==="member-register"){
   headers=["Member ID","Name","Mobile","NID","Installment","Status","Registration Date"];
   rows=members.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(m=>[m.memberId,m.nameBn||m.nameEn,m.mobile||"—",m.nid||"—",`৳${money(m.monthlyInstallment)}`,m.status,m.createdAt?new Date(m.createdAt).toLocaleDateString("en-GB"):"—"]);
 }else if(type==="new-members"){
   const arr=members.filter(m=>m.createdAt&&new Date(m.createdAt)>=new Date(from+"T00:00:00")&&new Date(m.createdAt)<=new Date(to+"T23:59:59"));
   headers=["Member ID","Name","Mobile","Installment","Status","Registration Date"];
   rows=arr.map(m=>[m.memberId,m.nameBn||m.nameEn,m.mobile||"—",`৳${money(m.monthlyInstallment)}`,m.status,new Date(m.createdAt).toLocaleDateString("en-GB")]);
 }else if(type==="inactive-members"){
   const arr=members.filter(m=>m.status==="inactive"||m.status==="rejected");
   headers=["Member ID","Name","Mobile","Status","Updated"];
   rows=arr.map(m=>[m.memberId,m.nameBn||m.nameEn,m.mobile||"—",m.status,m.updatedAt?new Date(m.updatedAt).toLocaleDateString("en-GB"):"—"]);
 }else if(type==="fund-summary"){
   const tx=reportApproved(ds).filter(inRange);
   const dep=tx.filter(d=>!reportIsWithdrawal(d)).reduce((a,d)=>a+Number(d.amount||0),0);
   const wdr=tx.filter(reportIsWithdrawal).reduce((a,d)=>a+Number(d.amount||0),0);
   headers=["বিষয়","পরিমাণ"];rows=[["মোট জমা",`৳${money(dep)}`],["মোট উত্তোলন",`৳${money(wdr)}`],["নেট তহবিল",`৳${money(dep-wdr)}`],["Approved Transaction",tx.length]];
   summary=`Period: ${from} — ${to}`;
 }else if(type==="pending"){
   const pm=members.filter(m=>m.status==="pending");
   const pd=ds.filter(d=>d.status==="pending");
   headers=["ধরন","ID","নাম/বিবরণ","তারিখ","পরিমাণ","Status"];
   rows=[...pm.map(m=>["Member Registration",m.memberId,m.nameBn||m.nameEn,m.createdAt?new Date(m.createdAt).toLocaleDateString("en-GB"):"—","—","pending"]),
         ...pd.map(d=>["Transaction",d.memberId,d.memberName,d.date,`৳${money(d.amount)}`,"pending"])];
 }else return null;

 return {title,from,to,headers,rows,summary:summary||`Period: ${from||"—"} — ${to||"—"}`};
}

   currentPage = page;

   containerEl.innerHTML = `

         <button class="neutral" id="actPrevBtn" ${currentPage === 1 ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>Previous</button>
         <span style="font-size:12px;font-weight:700">Page ${currentPage} of ${totalPages}</span>
         <button class="neutral" id="actNextBtn" ${currentPage >= totalPages ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>Next</button>
       </div>
     </div>
   `;
   
   const prevBtn = document.getElementById("actPrevBtn");
   const nextBtn = document.getElementById("actNextBtn");
   
   if(prevBtn){
     prevBtn.onclick = () => {
       if(currentPage > 1){
         renderPage(currentPage - 1);
       }
     };
   }
   
   if(nextBtn){
     nextBtn.onclick = () => {
       if(currentPage < totalPages){
         renderPage(currentPage + 1);
       }
     };
   }
 };
 
 renderPage(1);
}

     if(fbReady && member.authUid){
       const cloudChanged=await fbChangePasswordForSession(session,oldVal,newVal);
       if(!cloudChanged)return showAlertPopup("Firebase Authentication-এ Password পরিবর্তন করা যায়নি।");
     }
     member.localPassword = newVal;
     member.updatedAt = Date.now();
     await put("members", member);
     await queue("updateMember", member);
     if(!fbReady)await queue("changePassword",{role:"MEMBER",memberId:member.memberId,oldPassword:oldVal,newPassword:newVal});
   } else {
     const curAdminPw = get("adminPassword", "admin");
     if(session.username === "admin"){
       if(oldVal !== curAdminPw){
         showAlertPopup("Current Password সঠিক নয়।");
         return;
       }
       if(newVal !== confirmVal){
         showAlertPopup("New Password এবং Confirm Password মিল না হলে Popup দেখাবে।");
         return;
       }
       if(newVal.length < 4){
         showAlertPopup("নতুন পাসওয়ার্ড কমপক্ষে ৪ অক্ষরের হতে হবে।");
         return;
       }
       if(fbReady){
         const cloudChanged=await fbChangePasswordForSession(session,oldVal,newVal);
         if(!cloudChanged)return showAlertPopup("Firebase Authentication-এ Password পরিবর্তন করা যায়নি।");
       }
       await put("settings", {id:"adminPassword", key:"adminPassword", value:newVal});
       if(!fbReady)await queue("changePassword",{role:"ADMIN",oldPassword:oldVal,newPassword:newVal});
     } else {
       let makers = await all("members");
       let mk = makers.find(x => x.type === "maker" && x.username === session.username);
       if(!mk || oldVal !== mk.localPassword){
         showAlertPopup("Current Password সঠিক নয়।");
         return;
       }
       if(newVal !== confirmVal){
         showAlertPopup("New Password এবং Confirm Password মিল না হলে Popup দেখাবে।");
         return;
       }
       if(fbReady && mk.authUid){
         const cloudChanged=await fbChangePasswordForSession({...session,memberRecord:mk},oldVal,newVal);
         if(!cloudChanged)return showAlertPopup("Firebase Authentication-এ Password পরিবর্তন করা যায়নি।");
       }
       mk.localPassword = newVal;
       await put("members", mk);
       await queue("updateMember", mk);
       if(!fbReady)await queue("changePassword",{role:"MAKER",username:mk.username,oldPassword:oldVal,newPassword:newVal});
     }
   }

   await log("Password Change Activity", "Password successfully changed");
   
   showAlertPopup("Password পরিবর্তন সফল হয়েছে!", true, async () => {
     await log("Login/Logout Activity", `Auto Logged Out after password change: ${session.username||session.memberId}`);
     session = null;
     try { sessionStorage.removeItem("dhruvoSession"); } catch(e){}
     renderLogin();
   });
 };
}

// Show/Hide Password Toggle Helper Function
function togglePasswordVisibility(fieldId, btn){
 const field = document.getElementById(fieldId);
 if(field.type === "password"){
   field.type = "text";
   btn.style.color = "#5eaa7b";
 } else {
   field.type = "password";
   btn.style.color = "#6b7470";
 }
}

async function init(){
 await openDB();
 online=navigator.onLine;
 await firebaseInit();
 session=loadSession();
 if(session){
   // Restore the member record reference after a browser refresh.
   if(session.memberRecordId && !session.memberRecord)session.memberRecord=await one("members",session.memberRecordId);
   renderApp();
 }else renderLogin();
 window.addEventListener("online",async()=>{online=true;toast("Firebase Online");updateFirebaseStatus(fbReady);await migrateLocalToFirebase();await syncQueue()});
 window.addEventListener("offline",()=>{online=false;updateFirebaseStatus(false);toast("Offline / Local mode")});
 if(fbReady){
   try{
     if(session && session.role!=="MEMBER")await migrateLocalToFirebase();
     if(session)await fbStartRealtime();
     await syncQueue();
   }catch(e){console.warn("Firebase startup",e)}
 }
} 
init();
</script>
