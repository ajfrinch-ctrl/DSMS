/* ---------------- Theme: Light / Dark (AMOLED full-black) / Auto ---------------- */
function getSavedTheme(){ try{ const t = localStorage.getItem("dhruvoTheme"); return (t === "light" || t === "dark" || t === "auto") ? t : "auto"; }catch(e){ return "auto"; } }
function applyTheme(){
  const t = getSavedTheme();
  const mq = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)")) || null;
  const dark = t === "dark" || (t === "auto" && mq && mq.matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  try{ document.documentElement.style.colorScheme = dark ? "dark" : "light"; }catch(e){}
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", dark ? "#000000" : "#e9f7ef");
  const btn = document.getElementById("themeToggleBtn");
  if(btn){ btn.textContent = dark ? "☀️" : "🌙"; btn.title = "Theme: " + (dark ? "dark" : "light") + " (tap to change)"; }
}
function setTheme(t){ try{ localStorage.setItem("dhruvoTheme", t); }catch(e){} applyTheme(); }
function cycleTheme(){
  const t = getSavedTheme();
  const next = t === "auto" ? "light" : (t === "light" ? "dark" : "auto");
  setTheme(next);
  if(session) refreshCurrentView();
}
function wireThemeBtn(){ const b = document.getElementById("themeToggleBtn"); if(b) b.onclick = cycleTheme; applyTheme(); }
function themeBtnHtml(){ return `<button id="themeToggleBtn" class="neutral theme-btn" type="button" title="Theme (Light/Dark)" style="position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:10;box-shadow:var(--shadow)">🌙</button>`; }
if(window.matchMedia && typeof window.matchMedia("(prefers-color-scheme: dark)").addEventListener === "function"){
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if(getSavedTheme() === "auto") applyTheme(); });
}
